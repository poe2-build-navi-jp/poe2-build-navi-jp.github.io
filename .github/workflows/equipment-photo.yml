name: Check equipment photo import
on:
  pull_request:
    paths: ['assets/simulator*', 'assets/equipment-ocr/**', 'simulator/**', 'en/simulator/**', 'scripts/test-simulator-photo*', 'scripts/fixtures/equipment-photo/**', 'tools/enhance-simulator-photo.mjs', 'tools/prepare-equipment-ocr.mjs', 'package*.json', '.github/workflows/equipment-photo.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  photo-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node tools/prepare-equipment-ocr.mjs
      - run: node scripts/test-simulator-photo.mjs && node scripts/test-simulator-photo-ui.mjs
      - run: node node_modules/playwright-core/cli.js install --with-deps --only-shell chromium webkit
      - run: node scripts/test-simulator-photo-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: equipment-photo-browser-qa
          path: /tmp/poe2-photo-qa
          if-no-files-found: ignore
