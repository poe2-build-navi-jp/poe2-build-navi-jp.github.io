# Publishes only the website. Repository notes and tooling (company/, docs/, tools/, scripts/,
# tests/, package files, root notes) stay in Git but are not served.
# Takes effect once Settings → Pages → Build and deployment → Source is set to "GitHub Actions".
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Keep the installed Playwright version on its supported browser/dependency platform.
    runs-on: ubuntu-24.04
    # A slow package mirror once held the browser install for over 10 minutes; never wait 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check public search and skill images
        run: |
          npm ci --ignore-scripts
          node tools/prepare-equipment-ocr.mjs
          node scripts/test-simulator-photo.mjs
          node scripts/test-release-info.mjs
          npm run test:search
          npm run test:skill-icons
          node scripts/test-passive-icons.mjs
          node scripts/test-mobile-host.mjs
          npm run test:usability
      # Reuse the browser binaries and the system packages they need, so a slow Ubuntu mirror
      # does not hold up publishing. Both caches change only when package-lock.json changes.
      - name: Restore browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Restore browser system package cache
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: playwright-apt-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser for responsive checks
        timeout-minutes: 25
        run: |
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-downloads >/dev/null
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          if ls ~/apt-cache/*.deb >/dev/null 2>&1; then sudo cp ~/apt-cache/*.deb /var/cache/apt/archives/; fi
          # Each attempt stops after 10 minutes; a second attempt can reach a faster mirror.
          for attempt in 1 2; do
            if timeout 600 node node_modules/playwright-core/cli.js install --with-deps --only-shell chromium webkit; then
              break
            fi
            if [ "$attempt" = 2 ]; then echo "Browser install failed twice" >&2; exit 1; fi
            echo "Browser install attempt $attempt did not finish; retrying" >&2
          done
          mkdir -p ~/apt-cache
          cp /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true
      - name: Check phone, tablet and desktop usability
        run: npm run test:usability:browser && node scripts/test-reading-browser.mjs
      - name: Keep responsive check screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usability-screenshots
          path: |
            /tmp/poe2-usability-qa
            /tmp/poe2-reading-qa
          if-no-files-found: ignore
      - name: Collect site files
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'node_modules' \
            --exclude '/company/' --exclude '/docs/' --exclude '/tools/' --exclude '/scripts/' --exclude '/tests/' --exclude '/mobile/' \
            --exclude '/package.json' --exclude '/package-lock.json' --exclude '/.gitignore' --exclude '.indexnow' \
            --exclude '/NOTE_CONTENT_MAP.md' --exclude '/ASSET_SOURCES.md' --exclude '/README.md' --exclude '/CLAUDE.md' \
            --exclude '/site-update.zip' --exclude '/.claude/'
          node tools/stamp-mobile-release.mjs _site "$GITHUB_SHA"
          touch _site/.nojekyll
          test -f _site/index.html && test -f _site/sitemap.xml && test -f _site/ads.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Deploying from a separate job (as in GitHub's own Pages template) gives the uploaded artifact time
  # to appear: deploying right after the upload in the same job twice failed with
  # 'No artifacts named "github-pages" were found'. If only this job fails, re-run just this job:
  # re-running the build job as well would leave two github-pages artifacts in the run.
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
