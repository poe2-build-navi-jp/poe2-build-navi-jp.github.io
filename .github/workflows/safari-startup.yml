name: Check Safari engine startup
on:
  pull_request:
    paths: ['assets/simulator*.js', 'assets/simulator-engine/**', 'scripts/test-simulator-startup*', 'scripts/test-simulator-engine-loader.mjs', 'scripts/fixtures/simulator-engine-legacy-staging.js', '.github/workflows/safari-startup.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/test-simulator-engine-loader.mjs
      - run: node node_modules/playwright-core/cli.js install --with-deps --only-shell chromium webkit
      - run: node scripts/test-simulator-startup-browser.mjs && node scripts/test-simulator-startup-recovery-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-startup-comparison-${{ matrix.os }}
          path: /tmp/poe2-startup-qa
