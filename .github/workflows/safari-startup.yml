name: Check Safari engine startup
on:
  pull_request:
    paths: ['assets/simulator-engine-loader.js', 'assets/simulator-worker*', 'scripts/test-simulator-startup-browser.mjs', 'scripts/test-simulator-engine-loader.mjs', 'scripts/fixtures/simulator-engine-legacy-staging.js', '.github/workflows/safari-startup.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/test-simulator-engine-loader.mjs
      - run: node node_modules/playwright-core/cli.js install --with-deps --only-shell chromium webkit
      - run: node scripts/test-simulator-startup-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-startup-comparison
          path: /tmp/poe2-startup-qa
