name: Check 1.0 release information
on:
  pull_request:
    paths:
      - 'poe2-1-0/**'
      - 'data/seo-pages.json'
      - 'data/discovery.json'
      - 'tools/generate-seo-pages.mjs'
      - 'tools/generate-discovery-pages.mjs'
      - 'tools/generate-site-search.mjs'
      - 'scripts/test-release-info.mjs'
      - 'scripts/test-usability-browser.mjs'
      - '.github/workflows/release-info.yml'
permissions:
  contents: read
jobs:
  release-info:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/test-release-info.mjs && npm run test:search && node scripts/test-seo.mjs && node scripts/test-site-search.cjs
      - run: node node_modules/playwright-core/cli.js install --with-deps --only-shell chromium
      - run: npm run test:usability:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-responsive-screenshots
          path: /tmp/poe2-usability-qa
          if-no-files-found: ignore
