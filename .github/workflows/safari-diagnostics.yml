name: Diagnose Safari JSC compiler tiers
on:
  pull_request:
    paths: ['scripts/diagnose-safari-jit.mjs', '.github/workflows/safari-diagnostics.yml']
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        variant: [optimize, coalesce, flatten]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --prefix "$RUNNER_TEMP/wasm-opt" --ignore-scripts --no-audit --no-fund binaryen@125.0.0
      - run: node node_modules/playwright-core/cli.js install --with-deps webkit
      - run: node scripts/diagnose-safari-jit.mjs
        env:
          WASM_VARIANT: ${{ matrix.variant }}
          WASM_OPT: ${{ runner.temp }}/wasm-opt/node_modules/binaryen/bin/wasm-opt
