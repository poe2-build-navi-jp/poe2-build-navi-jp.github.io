name: Check My builds home
on:
  pull_request:
    paths: ['assets/my-build-home*', 'assets/simulator-model*', 'assets/simulator-goal*', 'tools/my-build-home-layout.mjs', 'tools/enhance-site-usability.mjs', 'scripts/test-my-build-home*', 'index.html', 'simulator/**', 'en/simulator/**', 'data/simulator-presets*.json', 'data/simulator-index.json', 'data/saved-build-updates.json', '.github/workflows/my-build-home.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  my-build-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/test-my-build-home.mjs
      - run: node node_modules/playwright-core/cli.js install --with-deps --only-shell chromium webkit
      - run: node scripts/test-my-build-home-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: my-build-home-screenshots
          path: /tmp/poe2-my-build-home-qa
