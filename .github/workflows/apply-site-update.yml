name: Apply one-time site update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified site files
        run: |
          test -f site-update.zip
          unzip -o site-update.zip
          rm site-update.zip
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Deploy SEO hubs and patch tracking"
          git push
