name: Apply one-time site update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified site files
        run: |
          if test -f site-update.zip; then
            unzip -o site-update.zip
            rm site-update.zip
          else
            test -f site-update.patch.gz.b64
            base64 -d site-update.patch.gz.b64 | gzip -d > /tmp/site-update.patch
            git apply /tmp/site-update.patch
            rm site-update.patch.gz.b64
            printf '%s' '' | base64 -d > .github/workflows/apply-site-update.yml
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Deploy SEO hubs and patch tracking"
          git push
