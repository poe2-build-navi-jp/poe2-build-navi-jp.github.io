<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>表示幅の検証</title></head><body><h1>画面幅別の検証</h1><label>ページ<select id="path"><option value="/">トップ</option><option value="/builds/">一覧</option><option value="/builds/monk/whirling-assault/">育成</option><option value="/gear-check/">装備診断</option></select></label><div id="frames"></div><script>const frames=document.getElementById('frames');for(const width of [320,375,390,430]){const title=document.createElement('h2');title.textContent=width+'px';const frame=document.createElement('iframe');frame.id='width-'+width;frame.title=width+'px';frame.width=width;frame.height=800;frame.src='/';frame.style.border='0';frames.append(title,frame);}document.getElementById('path').addEventListener('change',event=>document.querySelectorAll('iframe').forEach(frame=>frame.src=event.target.value));</script></body></html>
