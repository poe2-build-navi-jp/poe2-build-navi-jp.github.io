<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1700" viewBox="0 0 720 1700" role="img" aria-labelledby="title desc"><title id="title">グリムピラー（スペルトーテム）・オラクル</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜13（植物・序盤）：エンタングル（Entangle）を敵の進路へ置く。2 Lv14〜29（ボーンストーム転換）：ボーンストーム（Bonestorm）をフルチャージで使う。3 Lv30〜キャンペーン終了（リスペック準備）：リスペック3条件を確認する。4 トーテムへリスペック：スペルトーテム（Spell Totem）の実効Lv14を確認する。5 Mapping開始：スピリットの内訳を確認する。6 Early Endgame（ライフ型）：ヴォラナの包囲（Vorana's Siege）を導入する（孤立した敵＝ボスへの火力）。7 Endgame完成（ES／カオスイノキュレーション）：移行の可否を火力の余力で判断する</desc><g font-family="sans-serif"><rect width="720" height="1700" rx="24" fill="#0d1724"/><path d="M32 36h70" stroke="#e6b45f" stroke-width="5"/><text x="118" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="118" dy="0">POE2 BUILD NAVI</tspan></text><text x="32" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="32" dy="0">グリムピラー（スペルトーテム）・オラ</tspan><tspan x="32" dy="55.1">クル</tspan></text><text x="32" y="212" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="32" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="32" y="270" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="306" r="19" fill="#e6b45f"/><text x="59" y="313" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">1</tspan></text><text x="100" y="315" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv1〜13（植物・序盤）</tspan></text><text x="54" y="370" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">エンタングル（Entangle）を敵の進路へ置</tspan><tspan x="54" dy="43.5">く</tspan></text><rect x="32" y="482" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="518" r="19" fill="#e6b45f"/><text x="59" y="525" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">2</tspan></text><text x="100" y="527" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv14〜29（ボーンストーム転換）</tspan></text><text x="54" y="582" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">ボーンストーム（Bonestorm）をフルチャー</tspan><tspan x="54" dy="43.5">ジで使う</tspan></text><rect x="32" y="694" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="730" r="19" fill="#e6b45f"/><text x="59" y="737" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">3</tspan></text><text x="100" y="739" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv30〜キャンペーン終了（リスペック準備）</tspan></text><text x="54" y="794" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">リスペック3条件を確認する</tspan></text><rect x="32" y="862" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="898" r="19" fill="#e6b45f"/><text x="59" y="905" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">4</tspan></text><text x="100" y="907" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">トーテムへリスペック</tspan></text><text x="54" y="962" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">スペルトーテム（Spell Totem）の実効</tspan><tspan x="54" dy="43.5">Lv14を確認する</tspan></text><rect x="32" y="1074" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1110" r="19" fill="#e6b45f"/><text x="59" y="1117" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">5</tspan></text><text x="100" y="1119" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Mapping開始</tspan></text><text x="54" y="1174" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">スピリットの内訳を確認する</tspan></text><rect x="32" y="1242" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1278" r="19" fill="#e6b45f"/><text x="59" y="1285" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">6</tspan></text><text x="100" y="1287" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Early Endgame（ライフ型）</tspan></text><text x="54" y="1342" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">ヴォラナの包囲（Vorana's Siege）を導入</tspan><tspan x="54" dy="43.5">する（孤立した敵＝ボスへの火力）</tspan></text><rect x="32" y="1454" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1490" r="19" fill="#e6b45f"/><text x="59" y="1497" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">7</tspan></text><text x="100" y="1499" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Endgame完成（ES／カオスイノキュレーション）</tspan></text><text x="54" y="1554" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">移行の可否を火力の余力で判断する</tspan></text><text x="32" y="1661" fill="#a7b9cc" font-size="21" font-weight="400"><tspan x="32" dy="0">Patch 0.5.5 · 掲載データに基づく独自図解</tspan></text></g></svg>