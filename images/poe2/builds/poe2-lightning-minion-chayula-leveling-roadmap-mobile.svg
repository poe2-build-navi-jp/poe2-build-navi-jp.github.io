<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1478" viewBox="0 0 720 1478" role="img" aria-labelledby="title desc"><title id="title">雷ミニオン・チャユラの門弟</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜Act 3終了（クロスボウ・グレネード育成）：拾ったクロスボウでグレネード育成に切り替える。2 Lv41〜43前後・Act 3終盤〜キャンペーン終了（ミニオン移行）：ヴァールガード（爆弾型）を縛る。3 Early Mapping（スパーク・スペクター）：電気の狂信者（スピリット55・スパーク型）を縛る。4 Mid（軍団完成）：ブラスファミー＋ディスペアで呪いをオーラ化する。5 Late：レアベルトのミニオン追加投射物Modを確保する。6 Min-Max（完成形）：ザロクの贈り物に注入を替える</desc><g font-family="sans-serif"><rect width="720" height="1478" rx="24" fill="#0d1724"/><path d="M32 36h70" stroke="#e6b45f" stroke-width="5"/><text x="118" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="118" dy="0">POE2 BUILD NAVI</tspan></text><text x="32" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="32" dy="0">雷ミニオン・チャユラの門弟</tspan></text><text x="32" y="158" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="32" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="32" y="216" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="252" r="19" fill="#e6b45f"/><text x="59" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">1</tspan></text><text x="100" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv1〜Act 3終了（クロスボウ・グレネード育成）</tspan></text><text x="54" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">拾ったクロスボウでグレネード育成に切り替</tspan><tspan x="54" dy="43.5">える</tspan></text><rect x="32" y="428" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="464" r="19" fill="#e6b45f"/><text x="59" y="471" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">2</tspan></text><text x="100" y="473" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv41〜43前後・Act 3終盤〜キャンペーン終了（ミニオン移行）</tspan></text><text x="54" y="528" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">ヴァールガード（爆弾型）を縛る</tspan></text><rect x="32" y="596" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="632" r="19" fill="#e6b45f"/><text x="59" y="639" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">3</tspan></text><text x="100" y="641" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Early Mapping（スパーク・スペクター）</tspan></text><text x="54" y="696" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">電気の狂信者（スピリット55・スパーク型）</tspan><tspan x="54" dy="43.5">を縛る</tspan></text><rect x="32" y="808" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="844" r="19" fill="#e6b45f"/><text x="59" y="851" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">4</tspan></text><text x="100" y="853" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Mid（軍団完成）</tspan></text><text x="54" y="908" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">ブラスファミー＋ディスペアで呪いをオーラ</tspan><tspan x="54" dy="43.5">化する</tspan></text><rect x="32" y="1020" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1056" r="19" fill="#e6b45f"/><text x="59" y="1063" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">5</tspan></text><text x="100" y="1065" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Late</tspan></text><text x="54" y="1120" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">レアベルトのミニオン追加投射物Modを確保</tspan><tspan x="54" dy="43.5">する</tspan></text><rect x="32" y="1232" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1268" r="19" fill="#e6b45f"/><text x="59" y="1275" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">6</tspan></text><text x="100" y="1277" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Min-Max（完成形）</tspan></text><text x="54" y="1332" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">ザロクの贈り物に注入を替える</tspan></text><text x="32" y="1439" fill="#a7b9cc" font-size="21" font-weight="400"><tspan x="32" dy="0">Patch 0.5.5 · 掲載データに基づく独自図解</tspan></text></g></svg>