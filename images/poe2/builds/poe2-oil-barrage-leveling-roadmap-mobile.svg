<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1532" viewBox="0 0 720 1532" role="img" aria-labelledby="title desc"><title id="title">オイルバラージ・マーシャルアーティスト</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜13（ホロウパーム育成・Act 1前半）：フローズンローカスを設置し、グレイシャルカスケードの大スパイクで起爆する。2 Lv14〜キャンペーン終了（ストームウェーブ育成）：ストームウェーブでフローズンローカスを起爆して進む。3 Early Maps（オイルバラージ切替）：鐘をデバウアーで消費してパワーチャージを得る。4 Lv77〜Late Maps（タリスマン強化＋防御の底上げ）：アミュレットにソーマタージー発生装置を刻印する。5 Endgame（クリティカル100%・高IIR）：クリティカル率を100%に近づける。6 Aspirational（Lv21ジェム・長期目標）：主力スキルをLv21まで上げる</desc><g font-family="sans-serif"><rect width="720" height="1532" rx="24" fill="#0d1724"/><path d="M32 36h70" stroke="#e6b45f" stroke-width="5"/><text x="118" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="118" dy="0">POE2 BUILD NAVI</tspan></text><text x="32" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="32" dy="0">オイルバラージ・マーシャルアーティス</tspan><tspan x="32" dy="55.1">ト</tspan></text><text x="32" y="212" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="32" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="32" y="270" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="306" r="19" fill="#e6b45f"/><text x="59" y="313" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">1</tspan></text><text x="100" y="315" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv1〜13（ホロウパーム育成・Act 1前半）</tspan></text><text x="54" y="370" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">フローズンローカスを設置し、グレイシャル</tspan><tspan x="54" dy="43.5">カスケードの大スパイクで起爆する</tspan></text><rect x="32" y="482" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="518" r="19" fill="#e6b45f"/><text x="59" y="525" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">2</tspan></text><text x="100" y="527" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv14〜キャンペーン終了（ストームウェーブ育成）</tspan></text><text x="54" y="582" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">ストームウェーブでフローズンローカスを起</tspan><tspan x="54" dy="43.5">爆して進む</tspan></text><rect x="32" y="694" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="730" r="19" fill="#e6b45f"/><text x="59" y="737" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">3</tspan></text><text x="100" y="739" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Early Maps（オイルバラージ切替）</tspan></text><text x="54" y="794" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">鐘をデバウアーで消費してパワーチャージを</tspan><tspan x="54" dy="43.5">得る</tspan></text><rect x="32" y="906" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="942" r="19" fill="#e6b45f"/><text x="59" y="949" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">4</tspan></text><text x="100" y="951" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv77〜Late Maps（タリスマン強化＋防御の底上げ）</tspan></text><text x="54" y="1006" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">アミュレットにソーマタージー発生装置を刻</tspan><tspan x="54" dy="43.5">印する</tspan></text><rect x="32" y="1118" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1154" r="19" fill="#e6b45f"/><text x="59" y="1161" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">5</tspan></text><text x="100" y="1163" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Endgame（クリティカル100%・高IIR）</tspan></text><text x="54" y="1218" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">クリティカル率を100%に近づける</tspan></text><rect x="32" y="1286" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1322" r="19" fill="#e6b45f"/><text x="59" y="1329" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">6</tspan></text><text x="100" y="1331" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Aspirational（Lv21ジェム・長期目標）</tspan></text><text x="54" y="1386" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">主力スキルをLv21まで上げる</tspan></text><text x="32" y="1493" fill="#a7b9cc" font-size="21" font-weight="400"><tspan x="32" dy="0">Patch 0.5.5 · 掲載データに基づく独自図解</tspan></text></g></svg>