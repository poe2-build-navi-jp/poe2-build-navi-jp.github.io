<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1098" viewBox="0 0 1200 1098" role="img" aria-labelledby="title desc"><title id="title">スパーク・ストームウィーバー</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜10：Sparkをメインの攻撃ボタンに置く。2 Lv11〜20：Orb of Stormsを作って2つ設置する。3 Lv21〜30：試練を終えてStorm’s Recollectionを取る。4 Lv31〜40：SparkのサポートをZenith IIへ上げる。5 Lv41〜キャンペーン終了：Considered CastingをSparkに付ける。6 Mapping開始：耐性とエナジーシールドを整える。7 Early Endgame：Spiritを121以上に増やす。8 Endgame完成：最大マナ5,000以上を目指す</desc><g font-family="sans-serif"><rect width="1200" height="1098" rx="24" fill="#0d1724"/><path d="M48 36h70" stroke="#e6b45f" stroke-width="5"/><text x="134" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="134" dy="0">POE2 BUILD NAVI</tspan></text><text x="48" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="48" dy="0">スパーク・ストームウィーバー</tspan></text><text x="48" y="158" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="48" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="48" y="216" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="252" r="19" fill="#e6b45f"/><text x="75" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">1</tspan></text><text x="116" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Lv1〜10</tspan></text><text x="70" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">Sparkをメインの攻撃ボタンに置く</tspan></text><rect x="612" y="216" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="252" r="19" fill="#e6b45f"/><text x="639" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">2</tspan></text><text x="680" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Lv11〜20</tspan></text><text x="634" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">Orb of Stormsを作って2つ設置す</tspan><tspan x="634" dy="43.5">る</tspan></text><rect x="48" y=