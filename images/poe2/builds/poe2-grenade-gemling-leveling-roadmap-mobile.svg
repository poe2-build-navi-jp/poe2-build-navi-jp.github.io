<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1770" viewBox="0 0 720 1770" role="img" aria-labelledby="title desc"><title id="title">グレネード・ジェムリング</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜10：エクスプローシブグレネード（Explosive Grenade）へサポートを付ける。2 Lv11〜20：フラッシュグレネード（Flash Grenade）の役割を確認する。3 Lv21〜30：段階別ツリーと現在位置を照合する。4 Lv31〜40：アセンダンシー取得状況を確認する。5 Lv41〜キャンペーン終了：ACT 4構成へスキルを揃える。6 Mapping開始：Early Endgame版へ全体を揃える。7 Early Endgame：Mid Endgame版へ揃える。8 Endgame完成：採用するEndgame段階を決める</desc><g font-family="sans-serif"><rect width="720" height="1770" rx="24" fill="#0d1724"/><path d="M32 36h70" stroke="#e6b45f" stroke-width="5"/><text x="118" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="118" dy="0">POE2 BUILD NAVI</tspan></text><text x="32" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="32" dy="0">グレネード・ジェムリング</tspan></text><text x="32" y="158" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="32" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="32" y="216" width="656" height="232" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="252" r="19" fill="#e6b45f"/><text x="59" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">1</tspan></text><text x="100" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv1〜10</tspan></text><text x="54" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">エクスプローシブグレネード</tspan><tspan x="54" dy="43.5">（Explosive Grenade）へサポートを付け</tspan><tspan x="54" dy="43.5">る</tspan></text><rect x="32" y="472" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="508" r="19" fill="#e6b45f"/><text x="59" y="515" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">2</tspan></text><text x="100" y="517" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv11〜20</tspan></text><text x="54" y="572" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">フラッシュグレネード（Flash Grenade）</tspan><tspan x="54" dy="43.5">の役割を確認する</tspan></text><rect x="32" y="684" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="720" r="19" fill="#e6b45f"/><text x="59" y="727" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">3</tspan></text><text x="100" y="729" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv21〜30</tspan></text><text x="54" y="784" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">段階別ツリーと現在位置を照合する</tspan></text><rect x="32" y="852" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="888" r="19" fill="#e6b45f"/><text x="59" y="895" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">4</tspan></text><text x="100" y="897" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv31〜40</tspan></text><text x="54" y="952" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">アセンダンシー取得状況を確認する</tspan></text><rect x="32" y="1020" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1056" r="19" fill="#e6b45f"/><text x="59" y="1063" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">5</tspan></text><text x="100" y="1065" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv41〜キャンペーン終了</tspan></text><text x="54" y="1120" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">ACT 4構成へスキルを揃える</tspan></text><rect x="32" y="1188" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1224" r="19" fill="#e6b45f"/><text x="59" y="1231" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">6</tspan></text><text x="100" y="1233" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Mapping開始</tspan></text><text x="54" y="1288" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">Early Endgame版へ全体を揃える</tspan></text