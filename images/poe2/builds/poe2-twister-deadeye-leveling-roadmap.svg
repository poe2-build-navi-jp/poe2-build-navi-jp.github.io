<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1150" viewBox="0 0 1200 1150" role="img" aria-labelledby="title desc"><title id="title">ツイスター・デッドアイ</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜Act 1（ツイスター育成開始）：ハントレスのミュールを作り、ワーリングスラッシュとスピアとバックラーを倉庫経由で渡す（ミュールなしならライトニングアローでLv10前後まで育てる）。2 Act 2（フロストネクサス移行）：最初のLv2サポートジェムでフロストネクサスを切り、ファングオブフロストを外す。3 Act 3〜キャンペーン終了（ヘラルドオブアイス）：ヘラルドオブアイスを切って殲滅を底上げする。4 Mapping開始（Maps）：元素の地面を作るブーツを入手してフロストネクサスを使わずに済ませる。5 Endgame（Crit）：バラージをクールダウンごとに3回使える護符を最優先で入手し、ツイスターからサルヴォを外す。6 Endgame完成（Crit Aspirational）：完成形のユニークベルトを揃える</desc><g font-family="sans-serif"><rect width="1200" height="1150" rx="24" fill="#0d1724"/><path d="M48 36h70" stroke="#e6b45f" stroke-width="5"/><text x="134" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="134" dy="0">POE2 BUILD NAVI</tspan></text><text x="48" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="48" dy="0">ツイスター・デッドアイ</tspan></text><text x="48" y="158" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="48" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="48" y="216" width="540" height="320" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="252" r="19" fill="#e6b45f"/><text x="75" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">1</tspan></text><text x="116" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Lv1〜Act 1（ツイスター育成開始）</tspan></text><text x="70" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">ハントレスのミュールを作り、ワー</tspan><tspan x="70" dy="43.5">リングスラッシュとスピアとバック</tspan><tspan x="70" dy="43.5">ラーを倉庫経由で渡す（ミュールな</tspan><tspan x="70" dy="43.5">しならライトニングアローでLv10前</tspan><tspan x="70" dy="43.5">後まで育てる）</tspan></text><rect x="612" y="216" width="540" height="320" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="252" r="19" fill="#e6b45f"/><text x="639" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">2</tspan></text><text x="680" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Act 2（フロストネクサス移行）</tspan></text><text x="634" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">最初のLv2サポートジェムでフロス</tspan><tspan x="634" dy="43.5">トネクサスを切り、ファングオブフ</tspan><tspan x="634" dy="43.5">ロストを外す</tspan></text><rect x="48" y="560" width="540" height="232" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="596" r="19" fill="#e6b45f"/><text x="75" y="603" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">3</tspan></text><text x="116" y="605" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Act 3〜キャンペーン終了（ヘラルドオブアイス）</tspan></text><text x="70" y="660" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">ヘラルドオブアイスを切って殲滅を</tspan><tspan x="70" dy="43.5">底上げする</tspan></text><rect x="612" y="560" width="540" height="232" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="596" r="19" fill="#e6b45f"/><text x="639" y="603" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">4</tspan></text><text x="680" y="605" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Mapping開始（Maps）</tspan></text><text x="634" y="660" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">元素の地面を作るブーツを入手して</tspan><tspan x="634" dy="43.5">フロストネクサスを使わずに済ませ</tspan><tspan x="634" dy="43.5">る</tspan></text><rect x="48" y="816" width="540" height="232" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="852" r="19" fill="#e6b45f"/><text x="75" y="859" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">5</tspan></text><text x="116" y="861" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Endgame（Crit）</tspan></text><text x="70" y="916" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">バラージをクールダウンごとに3回</tspan><tspan x="70" dy="43.5">使える護符を最優先で入手し、ツイ</tspan><tspan x="70" dy="43.5">スターからサルヴォを外す</tspan></text><rect x="612" y="816" width="540" height="232" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="852" r="19" fill="#e6b45f"/><text x="639" y="859" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">6</tspan></text><text x="680" y="861" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Endgame完成（Crit Aspirational）</tspan></text><text x="634" y="916" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">完成形のユニークベルトを揃える</tspan></text><text x="48" y="1111" fill="#a7b9cc" font-size="21" font-weight="400"><tspan x="48" dy="0">Patch 0.5.5 · 掲載データに基づく独自図解</tspan></text></g></svg>