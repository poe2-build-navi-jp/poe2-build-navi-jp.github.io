<svg xmlns="http://www.w3.org/2000/svg" width="720" height="930" viewBox="0 0 720 930" role="img" aria-labelledby="title desc"><title id="title">シールドウォール・ウォーブリンガー</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜22（両手メイス育成）：Lv22までは両手メイスのローリングスラムとボーンシャッターで進める。2 Lv22〜キャンペーン終了（シールドウォール移行）：Lv22でアーマーの高い盾をギャンブルしてシールドウォールへ切り替える。3 Endgame完成（リネージサポートで亀裂を分岐）：リネージサポート2種を揃えて亀裂を分岐させる</desc><g font-family="sans-serif"><rect width="720" height="930" rx="24" fill="#0d1724"/><path d="M32 36h70" stroke="#e6b45f" stroke-width="5"/><text x="118" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="118" dy="0">POE2 BUILD NAVI</tspan></text><text x="32" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="32" dy="0">シールドウォール・ウォーブリンガー</tspan></text><text x="32" y="158" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="32" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="32" y="216" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="252" r="19" fill="#e6b45f"/><text x="59" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">1</tspan></text><text x="100" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv1〜22（両手メイス育成）</tspan></text><text x="54" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">Lv22までは両手メイスのローリングスラムと</tspan><tspan x="54" dy="43.5">ボーンシャッターで進める</tspan></text><rect x="32" y="428" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="464" r="19" fill="#e6b45f"/><text x="59" y="471" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">2</tspan></text><text x="100" y="473" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv22〜キャンペーン終了（シールドウォール移行）</tspan></text><text x="54" y="528" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">Lv22でアーマーの高い盾をギャンブルしてシ</tspan><tspan x="54" dy="43.5">ールドウォールへ切り替える</tspan></text><rect x="32" y="640" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="676" r="19" fill="#e6b45f"/><text x="59" y="683" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">3</tspan></text><text x="100" y="685" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Endgame完成（リネージサポートで亀裂を分岐）</tspan></text><text x="54" y="740" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">リネージサポート2種を揃えて亀裂を分岐さ</tspan><tspan x="54" dy="43.5">せる</tspan></text><text x="32" y="891" fill="#a7b9cc" font-size="21" font-weight="400"><tspan x="32" dy="0">Patch 0.5.5 · 掲載データに基づく独自図解</tspan></text></g></svg>