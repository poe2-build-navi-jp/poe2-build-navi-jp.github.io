<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc"><title id="title">グレイシャルランス・デッドアイ</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Act 1（ツイスター育成）：ワーリングスラッシュをLv1のままにする。2 Act 2序盤〜最初の試練（ツイスター継続）：バラージとアイスティップアローを追加する。3 最初の試練後〜キャンペーン終了（グレイシャルランス移行）：最初の試練後にグレイシャルランスへ切り替える。4 Mapping開始（Early Mapping）：セプターにエラミアのアイドルを差す。5 Endgame：エリアLv78でアコヤのスピアを拾ってクラフトする。6 Endgame完成（Aspirational）：完成形のユニークベルトを狙う</desc><g font-family="sans-serif"><rect width="1200" height="930" rx="24" fill="#0d1724"/><path d="M48 36h70" stroke="#e6b45f" stroke-width="5"/><text x="134" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="134" dy="0">POE2 BUILD NAVI</tspan></text><text x="48" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="48" dy="0">グレイシャルランス・デッドアイ</tspan></text><text x="48" y="158" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="48" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="48" y="216" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="252" r="19" fill="#e6b45f"/><text x="75" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">1</tspan></text><text x="116" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Act 1（ツイスター育成）</tspan></text><text x="70" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">ワーリングスラッシュをLv1のまま</tspan><tspan x="70" dy="43.5">にする</tspan></text><rect x="612" y="216" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="252" r="19" fill="#e6b45f"/><text x="639" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">2</tspan></text><text x="680" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Act 2序盤〜最初の試練（ツイスター継続）</tspan></text><text x="634" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">バラージとアイスティップアローを</tspan><tspan x="634" dy="43.5">追加する</tspan></text><rect x="48" y="428" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="464" r="19" fill="#e6b45f"/><text x="75" y="471" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">3</tspan></text><text x="116" y="473" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">最初の試練後〜キャンペーン終了（グレイシャルランス移行）</tspan></text><text x="70" y="528" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">最初の試練後にグレイシャルランス</tspan><tspan x="70" dy="43.5">へ切り替える</tspan></text><rect x="612" y="428" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="464" r="19" fill="#e6b45f"/><text x="639" y="471" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">4</tspan></text><text x="680" y="473" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Mapping開始（Early Mapping）</tspan></text><text x="634" y="528" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">セプターにエラミアのアイドルを差</tspan><tspan x="634" dy="43.5">す</tspan></text><rect x="48" y="640" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="676" r="19" fill="#e6b45f"/><text x="75" y="683" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">5</tspan></text><text x="116" y="685" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Endgame</tspan></text><text x="70" y="740" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">エリアLv78でアコヤのスピアを拾っ</tspan><tspan x="70" dy="43.5">てクラフトする</tspan></text><rect x="612" y="640" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="676" r="19" fill="#e6b45f"/><text x="639" y="683" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">6</tspan></text><text x="680" y="685" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Endgame完成（Aspirational）</tspan></text><text x="634" y="740" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">完成形のユニークベルトを狙う</tspan></text><text x="48" y="891" fill="#a7b9cc" font-size="21" font-weight="400"><tspan x="48" dy="0">Patch 0.5.5 · 掲載データに基づく独自図解</tspan></text></g></svg>