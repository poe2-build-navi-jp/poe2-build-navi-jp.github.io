<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1692" viewBox="0 0 720 1692" role="img" aria-labelledby="title desc"><title id="title">ワーリングアサルト・マーシャルアーティスト</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜10：Glacial Cascadeを最優先で強化する。2 Lv11〜20：Glacial Cascadeを優先して更新する。3 Lv21〜30：Lv22でStorm Waveへの移行を判断する。4 Lv31〜40：Lv41用のワーリングアサルトを準備する。5 Lv41〜キャンペーン終了：ワーリングアサルトへ切り替える。6 Mapping開始：Killing Palmで最初のチャージを作る。7 Early Endgame：チャージが途切れる原因を確認する。8 Endgame完成：基本ローテーションを安定させる</desc><g font-family="sans-serif"><rect width="720" height="1692" rx="24" fill="#0d1724"/><path d="M32 36h70" stroke="#e6b45f" stroke-width="5"/><text x="118" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="118" dy="0">POE2 BUILD NAVI</tspan></text><text x="32" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="32" dy="0">ワーリングアサルト・マーシャルアーテ</tspan><tspan x="32" dy="55.1">ィスト</tspan></text><text x="32" y="212" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="32" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="32" y="270" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="306" r="19" fill="#e6b45f"/><text x="59" y="313" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">1</tspan></text><text x="100" y="315" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv1〜10</tspan></text><text x="54" y="370" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">Glacial Cascadeを最優先で強化する</tspan></text><rect x="32" y="438" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="474" r="19" fill="#e6b45f"/><text x="59" y="481" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">2</tspan></text><text x="100" y="483" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv11〜20</tspan></text><text x="54" y="538" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">Glacial Cascadeを優先して更新する</tspan></text><rect x="32