<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1444" viewBox="0 0 720 1444" role="img" aria-labelledby="title desc"><title id="title">フロストボルト＋クリティカル時キャストのコメット・オラクル</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Act 1（アイスノヴァ＋フロストダーツ育成）：アイスノヴァで敵を凍結させて進む。2 Act 2（呪い追加）：エレメンタルウィークネスで敵の耐性を下げる。3 Act 3〜マップ（フロストウォール追加）：フロストウォールで氷の結晶を作る。4 Maps（クリティカル時キャスト＋コメット始動）：クリティカル時キャストでコメットを落とす。5 フロストボルト・スワップ（Lv32〜）：左リングの分岐指輪を装備してフロストボルトに切り替える。6 Endgame（CI＋ハイバジェット／ミニマックス）：カオスイノキュレーションへ移行する</desc><g font-family="sans-serif"><rect width="720" height="1444" rx="24" fill="#0d1724"/><path d="M32 36h70" stroke="#e6b45f" stroke-width="5"/><text x="118" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="118" dy="0">POE2 BUILD NAVI</tspan></text><text x="32" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="32" dy="0">フロストボルト＋クリティカル時キャス</tspan><tspan x="32" dy="55.1">トのコメット・オラクル</tspan></text><text x="32" y="212" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="32" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="32" y="270" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="306" r="19" fill="#e6b45f"/><text x="59" y="313" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">1</tspan></text><text x="100" y="315" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Act 1（アイスノヴァ＋フロストダーツ育成）</tspan></text><text x="54" y="370" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">アイスノヴァで敵を凍結させて進む</tspan></text><rect x="32" y="438" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="474" r="19" fill="#e6b45f"/><text x="59" y="481" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">2</tspan></text><text x="100" y="483" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Act 2（呪い追加）</tspan></text><text x="54" y="538" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">エレメンタルウィークネスで敵の耐性を下げ</tspan><tspan x="54" dy="43.5">る</tspan></text><rect x="32" y="650" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="686" r="19" fill="#e6b45f"/><text x="59" y="693" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">3</tspan></text><text x="100" y="695" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Act 3〜マップ（フロストウォール追加）</tspan></text><text x="54" y="750" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">フロストウォールで氷の結晶を作る</tspan></text><rect x="32" y="818" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="854" r="19" fill="#e6b45f"/><text x="59" y="861" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">4</tspan></text><text x="100" y="863" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Maps（クリティカル時キャスト＋コメット始動）</tspan></text><text x="54" y="918" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">クリティカル時キャストでコメットを落とす</tspan></text><rect x="32" y="986" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1022" r="19" fill="#e6b45f"/><text x="59" y="1029" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">5</tspan></text><text x="100" y="1031" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">フロストボルト・スワップ（Lv32〜）</tspan></text><text x="54" y="1086" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">左リングの分岐指輪を装備してフロストボル</tspan><tspan x="54" dy="43.5">トに切り替える</tspan></text><rect x="32" y="1198" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1234" r="19" fill="#e6b45f"/><text x="59" y="1241" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">6</tspan></text><text x="100" y="1243" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Endgame（CI＋ハイバジェット／ミニマックス）</tspan></text><text x="54" y="1298" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">カオスイノキュレーションへ移行する</tspan></text><text x="32" y="1405" fill="#a7b9cc" font-size="21" font-weight="400"><tspan x="32" dy="0">Patch 0.5.5 · 掲載データに基づく独自図解</tspan></text></g></svg>