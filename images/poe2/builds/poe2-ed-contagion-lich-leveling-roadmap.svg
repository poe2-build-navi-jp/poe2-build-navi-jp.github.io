<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1098" viewBox="0 0 1200 1098" role="img" aria-labelledby="title desc"><title id="title">ED・コンテージョン リッチ</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜10：コンテージョン（Contagion）へアンリーシュ（Unleash）を付ける。2 Lv11〜20：EDとコンテージョン（Contagion）の順番を試す。3 Lv21〜30：ボス用のウィザー（Wither）手段を確認する。4 Lv31〜40：ダークエフィジー（Dark Effigy）を強敵用に準備する。5 Lv41〜キャンペーン終了：キャンペーン用構成を完成させる。6 Mapping開始：T1用フルライフ構成へ揃える。7 Early Endgame：フルライフ版の不足を確認する。8 Endgame完成：フルライフかローライフか決める</desc><g font-family="sans-serif"><rect width="1200" height="1098" rx="24" fill="#0d1724"/><path d="M48 36h70" stroke="#e6b45f" stroke-width="5"/><text x="134" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="134" dy="0">POE2 BUILD NAVI</tspan></text><text x="48" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="48" dy="0">ED・コンテージョン リッチ</tspan></text><text x="48" y="158" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="48" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="48" y="216" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="252" r="19" fill="#e6b45f"/><text x="75" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">1</tspan></text><text x="116" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Lv1〜10</tspan></text><text x="70" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">コンテージョン（Contagion）へア</tspan><tspan x="70" dy="43.5">ンリーシュ（Unleash）を付ける</tspan></text><rect x="612" y="216" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="252" r="19" fill="#e6b45f"/><text x="639" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">2</tspan></text><text x="680" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Lv11〜20</tspan></text><text x="634" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">EDとコンテージョン</tspan><tspan x="634" dy="43.5">（Contagion）の順番を試す</tspan></text><rect x="48" y="428" width="540" height="232" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="464" r="19" fill="#e6b45f"/><text x="75" y="471" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">3</tspan></text><text x="116" y="473" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Lv21〜30</tspan></text><text x="70" y="528" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">ボス用のウィザー（Wither）手段</tspan><tspan x="70" dy="43.5">を確認する</tspan></text><rect x="612" y="428" width="540" height="232" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="464" r="19" fill="#e6b45f"/><text x="639" y="471" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">4</tspan></text><text x="680" y="473" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Lv31〜40</tspan></text><text x="634" y="528" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">ダークエフィジー</tspan><tspan x="634" dy="43.5">（Dark Effigy）を強敵用に準備</tspan><tspan x="634" dy="43.5">する</tspan></text><rect x="48" y="684" width="540" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="720" r="19" fill="#e6b45f"/><text x="75" y="727" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">5</tspan></text><text x="116" y="729" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Lv41〜キャンペーン終了</tspan></text><text x="70" y="784" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">キャンペーン用構成を完成させる</tspan></text><rect x="612" y="684" width="540" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="720" r="19" fill="#e6b45f"/><text x="639" y="727" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">6</tspan></text><text x="680" y="729" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Mapping開始</tspan></text><text x="634" y="784" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">T1用フルライフ構成へ揃える</tspan></text><rect x="48" y="852" width="540" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="888" r="19" fill="#e6b45f"/><text x="75" y="895" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">7</tspan></text><text x="116" y="897" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Early Endgame</tspan></text><text x="70" y="952" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">フルライフ版の不足を確認する</tspan></text><rect x="612" y="852" width="540" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="888" r="19" fill="#e6b45f"/><text x="639" y="895" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">8</tspan></text><text x="680" y="897" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Endgame完成</tspan></text><text x="634" y="952" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">フルライフかローライフか決める</tspan></text><text x="48" y="1059" fill="#a7b9cc" font-size="21" font-weight="400"><tspan x="48" dy="0">Patch 0.5.5 · 掲載データに基づく独自図解</tspan></text></g></svg>