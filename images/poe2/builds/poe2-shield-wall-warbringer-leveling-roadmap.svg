<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="762" viewBox="0 0 1200 762" role="img" aria-labelledby="title desc"><title id="title">シールドウォール・ウォーブリンガー</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜22（両手メイス育成）：Lv22までは両手メイスのローリングスラムとボーンシャッターで進める。2 Lv22〜キャンペーン終了（シールドウォール移行）：Lv22でアーマーの高い盾をギャンブルしてシールドウォールへ切り替える。3 Endgame完成（リネージサポートで亀裂を分岐）：リネージサポート2種を揃えて亀裂を分岐させる</desc><g font-family="sans-serif"><rect width="1200" height="762" rx="24" fill="#0d1724"/><path d="M48 36h70" stroke="#e6b45f" stroke-width="5"/><text x="134" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="134" dy="0">POE2 BUILD NAVI</tspan></text><text x="48" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="48" dy="0">シールドウォール・ウォーブリンガー</tspan></text><text x="48" y="158" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="48" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="48" y="216" width="540" height="232" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="252" r="19" fill="#e6b45f"/><text x="75" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">1</tspan></text><text x="116" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Lv1〜22（両手メイス育成）</tspan></text><text x="70" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">Lv22までは両手メイスのローリング</tspan><tspan x="70" dy="43.5">スラムとボーンシャッターで進める</tspan></text><rect x="612" y="216" width="540" height="232" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="252" r="19" fill="#e6b45f"/><text x="639" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">2</tspan></text><text x="680" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Lv22〜キャンペーン終了（シールドウォール移行）</tspan></text><text x="634" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">Lv22でアーマーの高い盾をギャンブ</tspan><tspan x="634" dy="43.5">ルしてシールドウォールへ切り替え</tspan><tspan x="634" dy="43.5">る</tspan></text><rect x="48" y="472" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="508" r="19" fill="#e6b45f"/><text x="75" y="515" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">3</tspan></text><text x="116" y="517" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Endgame完成（リネージサポートで亀裂を分岐）</tspan></text><text x="70" y="572" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">リネージサポート2種を揃えて亀裂</tspan><tspan x="70" dy="43.5">を分岐させる</tspan></text><text x="48" y="723" fill="#a7b9cc" font-size="21" font-weight="400"><tspan x="48" dy="0">Patch 0.5.5 · 掲載データに基づく独自図解</tspan></text></g></svg>