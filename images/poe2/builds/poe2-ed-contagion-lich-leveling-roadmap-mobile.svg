<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1814" viewBox="0 0 720 1814" role="img" aria-labelledby="title desc"><title id="title">ED・コンテージョン リッチ</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜10：コンテージョン（Contagion）へアンリーシュ（Unleash）を付ける。2 Lv11〜20：EDとコンテージョン（Contagion）の順番を試す。3 Lv21〜30：ボス用のウィザー（Wither）手段を確認する。4 Lv31〜40：ダークエフィジー（Dark Effigy）を強敵用に準備する。5 Lv41〜キャンペーン終了：キャンペーン用構成を完成させる。6 Mapping開始：T1用フルライフ構成へ揃える。7 Early Endgame：フルライフ版の不足を確認する。8 Endgame完成：フルライフかローライフか決める</desc><g font-family="sans-serif"><rect width="720" height="1814" rx="24" fill="#0d1724"/><path d="M32 36h70" stroke="#e6b45f" stroke-width="5"/><text x="118" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="118" dy="0">POE2 BUILD NAVI</tspan></text><text x="32" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="32" dy="0">ED・コンテージョン リッチ</tspan></text><text x="32" y="158" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="32" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="32" y="216" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="252" r="19" fill="#e6b45f"/><text x="59" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">1</tspan></text><text x="100" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv1〜10</tspan></text><text x="54" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">コンテージョン（Contagion）へアンリーシ</tspan><tspan x="54" dy="43.5">ュ（Unleash）を付ける</tspan></text><rect x="32" y="428" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="464" r="19" fill="#e6b45f"/><text x="59" y="471" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">2</tspan></text><text x="100" y="473" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv11〜20</tspan></text><text x="54" y="528" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">EDとコンテージョン（Contagion）の順番</tspan><ts