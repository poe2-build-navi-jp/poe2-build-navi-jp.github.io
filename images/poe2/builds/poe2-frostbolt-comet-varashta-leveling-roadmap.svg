<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="984" viewBox="0 0 1200 984" role="img" aria-labelledby="title desc"><title id="title">フロストボルト＋クリティカル時キャストのコメット・ヴァラシュタの弟子</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Act 1（アイスノヴァ＋フロストダーツ育成）：アイスノヴァで敵を凍結させて進む。2 Act 2（呪い追加）：エレメンタルウィークネスで敵の耐性を下げる。3 Act 3〜マップ（フロストウォール追加）：フロストウォールで氷の結晶を作る。4 Maps（元素系状態異常時キャスト＋コメット始動）：元素系状態異常時キャストでコメットを落とす。5 フロストボルト・スワップ（Lv32〜）：左リングの分岐指輪を装備してフロストボルトに切り替える。6 Endgame（CI＋ミニマックス）：カオスイノキュレーションへ移行する</desc><g font-family="sans-serif"><rect width="1200" height="984" rx="24" fill="#0d1724"/><path d="M48 36h70" stroke="#e6b45f" stroke-width="5"/><text x="134" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="134" dy="0">POE2 BUILD NAVI</tspan></text><text x="48" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="48" dy="0">フロストボルト＋クリティカル時キャストのコメット・ヴァラシ</tspan><tspan x="48" dy="55.1">ュタの弟子</tspan></text><text x="48" y="212" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="48" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="48" y="270" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="306" r="19" fill="#e6b45f"/><text x="75" y="313" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">1</tspan></text><text x="116" y="315" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Act 1（アイスノヴァ＋フロストダーツ育成）</tspan></text><text x="70" y="370" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">アイスノヴァで敵を凍結させて進む</tspan></text><rect x="612" y="270" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="306" r="19" fill="#e6b45f"/><text x="639" y="313" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">2</tspan></text><text x="680" y="315" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Act 2（呪い追加）</tspan></text><text x="634" y="370" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">エレメンタルウィークネスで敵の耐</tspan><tspan x="634" dy="43.5">性を下げる</tspan></text><rect x="48" y="482" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="518" r="19" fill="#e6b45f"/><text x="75" y="525" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">3</tspan></text><text x="116" y="527" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Act 3〜マップ（フロストウォール追加）</tspan></text><text x="70" y="582" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">フロストウォールで氷の結晶を作る</tspan></text><rect x="612" y="482" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="518" r="19" fill="#e6b45f"/><text x="639" y="525" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">4</tspan></text><text x="680" y="527" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Maps（元素系状態異常時キャスト＋コメット始動）</tspan></text><text x="634" y="582" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">元素系状態異常時キャストでコメッ</tspan><tspan x="634" dy="43.5">トを落とす</tspan></text><rect x="48" y="694" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="730" r="19" fill="#e6b45f"/><text x="75" y="737" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">5</tspan></text><text x="116" y="739" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">フロストボルト・スワップ（Lv32〜）</tspan></text><text x="70" y="794" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">左リングの分岐指輪を装備してフロ</tspan><tspan x="70" dy="43.5">ストボルトに切り替える</tspan></text><rect x="612" y="694" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="730" r="19" fill="#e6b45f"/><text x="639" y="737" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">6</tspan></text><text x="680" y="739" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Endgame（CI＋ミニマックス）</tspan></text><text x="634" y="794" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">カオスイノキュレーションへ移行す</tspan><tspan x="634" dy="43.5">る</tspan></text><text x="48" y="945" fill="#a7b9cc" font-size="21" font-weight="400"><tspan x="48" dy="0">Patch 0.5.5 · 掲載データに基づく独自図解</tspan></text></g></svg>