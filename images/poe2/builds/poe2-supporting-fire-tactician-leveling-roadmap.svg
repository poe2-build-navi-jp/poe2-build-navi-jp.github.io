<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="974" viewBox="0 0 1200 974" role="img" aria-labelledby="title desc"><title id="title">サポーティングファイヤー・タクティシャン</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜Act 2中盤（クロスボウ育成）：武器セット設定（パーマフロストボルト＝セットI／フラグメンテーション弾＝セットII）を行う。2 Lv36〜キャンペーン終了（サポーティングファイヤー移行）：Lv36で約21,700ゴールドを使ってリスペックする。3 Mapping開始（Early）：スピリット確保のユニーク胴を最優先で買う。4 Red Maps：全ミニオンスキルレベル+2のバックラーを狙う。5 Endgame完成（CI・支配取得）：支配をアミュレットにインスタレーションする</desc><g font-family="sans-serif"><rect width="1200" height="974" rx="24" fill="#0d1724"/><path d="M48 36h70" stroke="#e6b45f" stroke-width="5"/><text x="134" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="134" dy="0">POE2 BUILD NAVI</tspan></text><text x="48" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="48" dy="0">サポーティングファイヤー・タクティシャン</tspan></text><text x="48" y="158" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="48" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="48" y="216" width="540" height="232" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="252" r="19" fill="#e6b45f"/><text x="75" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">1</tspan></text><text x="116" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Lv1〜Act 2中盤（クロスボウ育成）</tspan></text><text x="70" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">武器セット設定（パーマフロストボ</tspan><tspan x="70" dy="43.5">ルト＝セットI／フラグメンテーシ</tspan><tspan x="70" dy="43.5">ョン弾＝セットII）を行う</tspan></text><rect x="612" y="216" width="540" height="232" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="252" r="19" fill="#e6b45f"/><text x="639" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">2</tspan></text><text x="680" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Lv36〜キャンペーン終了（サポーティングファイヤー移行）</tspan></text><text x="634" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">Lv36で約21,700ゴールドを使って</tspan><tspan x="634" dy="43.5">リスペックする</tspan></text><rect x="48" y="472" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="508" r="19" fill="#e6b45f"/><text x="75" y="515" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">3</tspan></text><text x="116" y="517" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Mapping開始（Early）</tspan></text><text x="70" y="572" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">スピリット確保のユニーク胴を最優</tspan><tspan x="70" dy="43.5">先で買う</tspan></text><rect x="612" y="472" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="508" r="19" fill="#e6b45f"/><text x="639" y="515" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">4</tspan></text><text x="680" y="517" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Red Maps</tspan></text><text x="634" y="572" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">全ミニオンスキルレベル+2のバック</tspan><tspan x="634" dy="43.5">ラーを狙う</tspan></text><rect x="48" y="684" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="720" r="19" fill="#e6b45f"/><text x="75" y="727" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">5</tspan></text><text x="116" y="729" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Endgame完成（CI・支配取得）</tspan></text><text x="70" y="784" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">支配をアミュレットにインスタレー</tspan><tspan x="70" dy="43.5">ションする</tspan></text><text x="48" y="935" fill="#a7b9cc" font-size="21" font-weight="400"><tspan x="48" dy="0">Patch 0.5.5 · 掲載データに基づく独自図解</tspan></text></g></svg>