<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc"><title id="title">オイルバラージ・マーシャルアーティスト</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜13（ホロウパーム育成・Act 1前半）：フローズンローカスを設置し、グレイシャルカスケードの大スパイクで起爆する。2 Lv14〜キャンペーン終了（ストームウェーブ育成）：ストームウェーブでフローズンローカスを起爆して進む。3 Early Maps（オイルバラージ切替）：鐘をデバウアーで消費してパワーチャージを得る。4 Lv77〜Late Maps（タリスマン強化＋防御の底上げ）：アミュレットにソーマタージー発生装置を刻印する。5 Endgame（クリティカル100%・高IIR）：クリティカル率を100%に近づける。6 Aspirational（Lv21ジェム・長期目標）：主力スキルをLv21まで上げる</desc><g font-family="sans-serif"><rect width="1200" height="930" rx="24" fill="#0d1724"/><path d="M48 36h70" stroke="#e6b45f" stroke-width="5"/><text x="134" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="134" dy="0">POE2 BUILD NAVI</tspan></text><text x="48" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="48" dy="0">オイルバラージ・マーシャルアーティスト</tspan></text><text x="48" y="158" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="48" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="48" y="216" width="540" height="232" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="252" r="19" fill="#e6b45f"/><text x="75" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">1</tspan></text><text x="116" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Lv1〜13（ホロウパーム育成・Act 1前半）</tspan></text><text x="70" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">フローズンローカスを設置し、グレ</tspan><tspan x="70" dy="43.5">イシャルカスケードの大スパイクで</tspan><tspan x="70" dy="43.5">起爆する</tspan></text><rect x="612" y="216" width="540" height="232" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="252" r="19" fill="#e6b45f"/><text x="639" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">2</tspan></text><text x="680" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Lv14〜キャンペーン終了（ストームウェーブ育成）</tspan></text><text x="634" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">ストームウェーブでフローズンロー</tspan><tspan x="634" dy="43.5">カスを起爆して進む</tspan></text><rect x="48" y="472" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="508" r="19" fill="#e6b45f"/><text x="75" y="515" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">3</tspan></text><text x="116" y="517" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Early Maps（オイルバラージ切替）</tspan></text><text x="70" y="572" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">鐘をデバウアーで消費してパワーチ</tspan><tspan x="70" dy="43.5">ャージを得る</tspan></text><rect x="612" y="472" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="508" r="19" fill="#e6b45f"/><text x="639" y="515" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">4</tspan></text><text x="680" y="517" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Lv77〜Late Maps（タリスマン強化＋防御の底上げ）</tspan></text><text x="634" y="572" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">アミュレットにソーマタージー発生</tspan><tspan x="634" dy="43.5">装置を刻印する</tspan></text><rect x="48" y="684" width="540" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="720" r="19" fill="#e6b45f"/><text x="75" y="727" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">5</tspan></text><text x="116" y="729" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Endgame（クリティカル100%・高IIR）</tspan></text><text x="70" y="784" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">クリティカル率を100%に近づける</tspan></text><rect x="612" y="684" width="540" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="720" r="19" fill="#e6b45f"/><text x="639" y="727" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">6</tspan></text><text x="680" y="729" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Aspirational（Lv21ジェム・長期目標）</tspan></text><text x="634" y="784" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">主力スキルをLv21まで上げる</tspan></text><text x="48" y="891" fill="#a7b9cc" font-size="21" font-weight="400"><tspan x="48" dy="0">Patch 0.5.5 · 掲載データに基づく独自図解</tspan></text></g></svg>