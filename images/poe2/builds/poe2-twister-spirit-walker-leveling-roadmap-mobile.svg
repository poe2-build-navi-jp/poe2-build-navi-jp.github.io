<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1814" viewBox="0 0 720 1814" role="img" aria-labelledby="title desc"><title id="title">ツイスター・スピリットウォーカー</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜10：槍とワーリングスラッシュ（Whirling Slash）・ツイスター（Twister）のジェムを用意する。2 Lv11〜20：ワーリングスラッシュ（Whirling Slash）で旋風を作る。3 Lv21〜30：アイスティップアロー（Ice-Tipped Arrows）を連携へ加える。4 Lv31〜40：旋風を複数作ってから攻撃する。5 Lv41〜キャンペーン終了：武器セット別のスキルを固定する。6 Mapping開始：属性耐性と回避を先に整える。7 Early Endgame：Endgame段階のパッシブを確認する。8 Endgame完成：Endgame構成と装備段階を揃える</desc><g font-family="sans-serif"><rect width="720" height="1814" rx="24" fill="#0d1724"/><path d="M32 36h70" stroke="#e6b45f" stroke-width="5"/><text x="118" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="118" dy="0">POE2 BUILD NAVI</tspan></text><text x="32" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="32" dy="0">ツイスター・スピリットウォーカー</tspan></text><text x="32" y="158" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="32" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="32" y="216" width="656" height="232" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="252" r="19" fill="#e6b45f"/><text x="59" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">1</tspan></text><text x="100" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv1〜10</tspan></text><text x="54" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">槍とワーリングスラッシュ</tspan><tspan x="54" dy="43.5">（Whirling Slash）・ツイスター</tspan><tspan x="54" dy="43.5">（Twister）のジェムを用意する</tspan></text><rect x="32" y="472" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="508" r="19" fill="#e6b45f"/><text x="59" y="515" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">2</tspan></text><text x="100" y="517" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv11〜20</tspan></text><text x="54" y="572" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">ワーリングスラッシュ（Whirling Slash）</tspan><tspan x="54" dy="43.5">で旋風を作る</tspan></text><rect x="32" y="684" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="720" r="19" fill="#e6b45f"/><text x="59" y="727" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">3</tspan></text><text x="100" y="729" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv21〜30</tspan></text><text x="54" y="784" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">アイスティップアロー</tspan><tspan x="54" dy="43.5">（Ice-Tipped Arrows）を連携へ加える</tspan></text><rect x="32" y="896" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="932" r="19" fill="#e6b45f"/><text x="59" y="939" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">4</tspan></text><text x="100" y="941" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv31〜40</tspan></text><text x="54" y="996" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">旋風を複数作ってから攻撃する</tspan></text><rect x="32" y="1064" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1100" r="19" fill="#e6b45f"/><text x="59" y="1107" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">5</tspan></text><text x="100" y="1109" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv41〜キャンペーン終了</tspan></text><text x="54" y="1164" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">武器セット別のスキルを固定する</tspan></text><rect x="32" y="1232" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1268" r="19" fill="#e6b45f"/><text x="59" y="1275" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">6</tspan></text><text x="100" y="1277" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Mapping開始</tspan></text><text x="54" y="1332" fill="#e9eef