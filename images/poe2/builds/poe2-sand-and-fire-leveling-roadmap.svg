<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1054" viewBox="0 0 1200 1054" role="img" aria-labelledby="title desc"><title id="title">砂と炎のヴァラシュタ</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜10：Lv6でエッセンスドレイン（Essence Drain）へ移行する。2 Lv11〜20：エッセンスドレイン（Essence Drain）とコンテージョン（Contagion）を継続する。3 Lv21〜30：最初のアセンダンシーを完了する。4 Lv31〜40：Lv36で招集（Muster）を確認する。5 Lv41〜キャンペーン終了：ルザンの罠を戦闘開始時に使う。6 Mapping開始：耐性と防御を先に安定させる。7 Early Endgame：ES移行を1部位ずつ行う。8 Endgame完成：周回とボスの操作順を分ける</desc><g font-family="sans-serif"><rect width="1200" height="1054" rx="24" fill="#0d1724"/><path d="M48 36h70" stroke="#e6b45f" stroke-width="5"/><text x="134" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="134" dy="0">POE2 BUILD NAVI</tspan></text><text x="48" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="48" dy="0">砂と炎のヴァラシュタ</tspan></text><text x="48" y="158" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="48" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="48" y="216" width="540" height="232" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="252" r="19" fill="#e6b45f"/><text x="75" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">1</tspan></text><text x="116" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Lv1〜10</tspan></text><text x="70" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">Lv6でエッセンスドレイン</tspan><tspan x="70" dy="43.5">（Essence Drain）へ移行する</tspan></text><rect x="612" y="216" width="540" height="232" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="252" r="19" fill="#e6b45f"/><text x="639" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">2</tspan></text><text x="680" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Lv11〜20</tspan></text><text x="634" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">エッセンスドレイン</tspan><tspan x="634" dy="43.5">（Essence Drain）とコンテージ</tspan><tspan x="634" dy="43.5">ョン（Contagion）を継続する</tspan></text><rect x="48" y="472" width="540" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="508" r="19" fill="#e6b45f"/><text x="75" y="515" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">3</tspan></text><text x="116" y="517" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Lv21〜30</tspan></text><text x="70" y="572" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">最初のアセンダンシーを完了する</tspan></text><rect x="612" y="472" width="540" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="508" r="19" fill="#e6b45f"/><text x="639" y="515" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">4</tspan></text><text x="680" y="517" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Lv31〜40</tspan></text><text x="634" y="572" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">Lv36で招集（Muster）を確認する</tspan></text><rect x="48" y="640" width="540" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="676" r="19" fill="#e6b45f"/><text x="75" y="683" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">5</tspan></text><text x="116" y="685" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Lv41〜キャンペーン終了</tspan></text><text x="70" y="740" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">ルザンの罠を戦闘開始時に使う</tspan></text><rect x="612" y="640" width="540" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="676" r="19" fill="#e6b45f"/><text x="639" y="683" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">6</tspan></text><text x="680" y="685" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Mapping開始</tspan></text><text x="634" y="740" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">耐性と防御を先に安定させる</tspan></text><rect x="48" y="808" width="540" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="844" r="19" fill="#e6b45f"/><text x="75" y="851" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">7</tspan></text><text x="116" y="853" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Early Endgame</tspan></text><text x="70" y="908" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">ES移行を1部位ずつ行う</tspan></text><rect x="612" y="808" width="540" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="844" r="19" fill="#e6b45f"/><text x="639" y="851" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">8</tspan></text><text x="680" y="853" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Endgame完成</tspan></text><text x="634" y="908" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">周回とボスの操作順を分ける</tspan></text><text x="48" y="1015" fill="#a7b9cc" font-size="21" font-weight="400"><tspan x="48" dy="0">Patch 0.5.5 · 掲載データに基づく独自図解</tspan></text></g></svg>