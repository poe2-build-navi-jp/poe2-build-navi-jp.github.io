<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc"><title id="title">インファーナルリージョン・チャユラの門弟</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜13（Act 1序盤：クォータースタッフ）：ダメージの高いクォータースタッフに更新する。2 Lv14〜Act 4終了（アイスストライク育成）：アイスストライクとヘラルドオブアイスで凍結連鎖を作る。3 Lv56前後〜移行（相棒捕獲とリスペック）：疫病の摘出者（全ダメージが発火）を捕獲する。4 Early Mapping：全ミニオンスキルレベル+1のバックラーを入手する。5 Red Maps（ワスプ構成への移行）：ゾフの火葬を入手してワスプ構成へ移行する。6 Endgame完成（カオスイノキュレーション型）：ES約6,000でカオスイノキュレーションへ移行する</desc><g font-family="sans-serif"><rect width="1200" height="930" rx="24" fill="#0d1724"/><path d="M48 36h70" stroke="#e6b45f" stroke-width="5"/><text x="134" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="134" dy="0">POE2 BUILD NAVI</tspan></text><text x="48" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="48" dy="0">インファーナルリージョン・チャユラの門弟</tspan></text><text x="48" y="158" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="48" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="48" y="216" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="252" r="19" fill="#e6b45f"/><text x="75" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">1</tspan></text><text x="116" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Lv1〜13（Act 1序盤：クォータースタッフ）</tspan></text><text x="70" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">ダメージの高いクォータースタッフ</tspan><tspan x="70" dy="43.5">に更新する</tspan></text><rect x="612" y="216" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="252" r="19" fill="#e6b45f"/><text x="639" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">2</tspan></text><text x="680" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Lv14〜Act 4終了（アイスストライク育成）</tspan></text><text x="634" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">アイスストライクとヘラルドオブア</tspan><tspan x="634" dy="43.5">イスで凍結連鎖を作る</tspan></text><rect x="48" y="428" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="464" r="19" fill="#e6b45f"/><text x="75" y="471" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">3</tspan></text><text x="116" y="473" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Lv56前後〜移行（相棒捕獲とリスペック）</tspan></text><text x="70" y="528" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">疫病の摘出者（全ダメージが発火）</tspan><tspan x="70" dy="43.5">を捕獲する</tspan></text><rect x="612" y="428" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="464" r="19" fill="#e6b45f"/><text x="639" y="471" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">4</tspan></text><text x="680" y="473" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Early Mapping</tspan></text><text x="634" y="528" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">全ミニオンスキルレベル+1のバック</tspan><tspan x="634" dy="43.5">ラーを入手する</tspan></text><rect x="48" y="640" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="676" r="19" fill="#e6b45f"/><text x="75" y="683" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">5</tspan></text><text x="116" y="685" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Red Maps（ワスプ構成への移行）</tspan></text><text x="70" y="740" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">ゾフの火葬を入手してワスプ構成へ</tspan><tspan x="70" dy="43.5">移行する</tspan></text><rect x="612" y="640" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="676" r="19" fill="#e6b45f"/><text x="639" y="683" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">6</tspan></text><text x="680" y="685" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Endgame完成（カオスイノキュレーション型）</tspan></text><text x="634" y="740" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">ES約6,000でカオスイノキュレーシ</tspan><tspan x="634" dy="43.5">ョンへ移行する</tspan></text><text x="48" y="891" fill="#a7b9cc" font-size="21" font-weight="400"><tspan x="48" dy="0">Patch 0.5.5 · 掲載データに基づく独自図解</tspan></text></g></svg>