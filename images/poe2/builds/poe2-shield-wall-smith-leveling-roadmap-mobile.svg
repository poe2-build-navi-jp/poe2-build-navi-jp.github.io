<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1726" viewBox="0 0 720 1726" role="img" aria-labelledby="title desc"><title id="title">シールドウォール・スミス</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜10：ローリングスラム1段目からボーンシャッターへつなぐ。2 Lv11〜20：Lv14でパーフェクトストライク（Perfect Strike）を追加する。3 Lv21〜30：Lv22でシールドウォールへ切り替える。4 Lv31〜40：盾のアーマー値を比較する。5 Lv41〜キャンペーン終了：Act 4→Interludesの順に進める。6 Mapping開始：Maps段階別ツリーへ移る。7 Early Endgame：不足が火力か防御か確認する。8 Endgame完成：完成形を1種類に決める</desc><g font-family="sans-serif"><rect width="720" height="1726" rx="24" fill="#0d1724"/><path d="M32 36h70" stroke="#e6b45f" stroke-width="5"/><text x="118" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="118" dy="0">POE2 BUILD NAVI</tspan></text><text x="32" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="32" dy="0">シールドウォール・スミス</tspan></text><text x="32" y="158" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="32" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="32" y="216" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="252" r="19" fill="#e6b45f"/><text x="59" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">1</tspan></text><text x="100" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv1〜10</tspan></text><text x="54" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">ローリングスラム1段目からボーンシャッタ</tspan><tspan x="54" dy="43.5">ーへつなぐ</tspan></text><rect x="32" y="428" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="464" r="19" fill="#e6b45f"/><text x="59" y="471" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">2</tspan></text><text x="100" y="473" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv11〜20</tspan></text><text x="54" y="528" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">Lv14でパーフェクトストライク</tspan><tspan x="54" dy="43.5">（Perfect Strike）を追加する</tspan></text><rect x="32" y="640" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="676" r="19" fill="#e6b45f"/><text x="59" y="683" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">3</tspan></text><text x="100" y="685" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv21〜30</tspan></text><text x="54" y="740" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">Lv22でシールドウォールへ切り替える</tspan></text><rect x="32" y="808" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="844" r="19" fill="#e6b45f"/><text x="59" y="851" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">4</tspan></text><text x="100" y="853" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv31〜40</tspan></text><text x="54" y="908" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">盾のアーマー値を比較する</tspan></text><rect x="32" y="976" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1012" r="19" fill="#e6b45f"/><text x="59" y="1019" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">5</tspan></text><text x="100" y="1021" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv41〜キャンペーン終了</tspan></text><text x="54" y="1076" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">Act 4→Interludesの順に進める</tspan></text><rect x="32" y="1144" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1180" r="19" fill="#e6b45f"/><text x="59" y="1187" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">6</tspan></text><text x="100" y="1189" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Mapping開始</tspan></text><text x="54" y="1244" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">Maps段階別ツリーへ移る</tspan></text><rect x="32" y="1312" width="656" height="144" rx="18" fill="#172536"