<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1142" viewBox="0 0 1200 1142" role="img" aria-labelledby="title desc"><title id="title">グリムピラー（スペルトーテム）・オラクル</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜13（植物・序盤）：エンタングル（Entangle）を敵の進路へ置く。2 Lv14〜29（ボーンストーム転換）：ボーンストーム（Bonestorm）をフルチャージで使う。3 Lv30〜キャンペーン終了（リスペック準備）：リスペック3条件を確認する。4 トーテムへリスペック：スペルトーテム（Spell Totem）の実効Lv14を確認する。5 Mapping開始：スピリットの内訳を確認する。6 Early Endgame（ライフ型）：ヴォラナの包囲（Vorana's Siege）を導入する（孤立した敵＝ボスへの火力）。7 Endgame完成（ES／カオスイノキュレーション）：移行の可否を火力の余力で判断する</desc><g font-family="sans-serif"><rect width="1200" height="1142" rx="24" fill="#0d1724"/><path d="M48 36h70" stroke="#e6b45f" stroke-width="5"/><text x="134" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="134" dy="0">POE2 BUILD NAVI</tspan></text><text x="48" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="48" dy="0">グリムピラー（スペルトーテム）・オラクル</tspan></text><text x="48" y="158" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="48" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="48" y="216" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="252" r="19" fill="#e6b45f"/><text x="75" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">1</tspan></text><text x="116" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Lv1〜13（植物・序盤）</tspan></text><text x="70" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">エンタングル（Entangle）を敵の</tspan><tspan x="70" dy="43.5">進路へ置く</tspan></text><rect x="612" y="216" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="252" r="19" fill="#e6b45f"/><text x="639" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">2</tspan></text><text x="680" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Lv14〜29（ボーンストーム転換）</tspan></text><text x="634" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">ボーンストーム（Bonestorm）をフ</tspan><tspan x="634" dy="43.5">ルチャージで使う</tspan></text><rect x="48" y="428" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="464" r="19" fill="#e6b45f"/><text x="75" y="471" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">3</tspan></text><text x="116" y="473" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Lv30〜キャンペーン終了（リスペック準備）</tspan></text><text x="70" y="528" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">リスペック3条件を確認する</tspan></text><rect x="612" y="428" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="464" r="19" fill="#e6b45f"/><text x="639" y="471" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">4</tspan></text><text x="680" y="473" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">トーテムへリスペック</tspan></text><text x="634" y="528" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">スペルトーテム（Spell Totem）</tspan><tspan x="634" dy="43.5">の実効Lv14を確認する</tspan></text><rect x="48" y="640" width="540" height="232" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="676" r="19" fill="#e6b45f"/><text x="75" y="683" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">5</tspan></text><text x="116" y="685" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Mapping開始</tspan></text><text x="70" y="740" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">スピリットの内訳を確認する</tspan></text><rect x="612" y="640" width="540" height="232" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="676" r="19" fill="#e6b45f"/><text x="639" y="683" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">6</tspan></text><text x="680" y="685" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Early Endgame（ライフ型）</tspan></text><text x="634" y="740" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">ヴォラナの包囲</tspan><tspan x="634" dy="43.5">（Vorana's Siege）を導入する（</tspan><tspan x="634" dy="43.5">孤立した敵＝ボスへの火力）</tspan></text><rect x="48" y="896" width="540" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="932" r="19" fill="#e6b45f"/><text x="75" y="939" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">7</tspan></text><text x="116" y="941" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Endgame完成（ES／カオスイノキュレーション）</tspan></text><text x="70" y="996" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">移行の可否を火力の余力で判断する</tspan></text><text x="48" y="1103" fill="#a7b9cc" font-size="21" font-weight="400"><tspan x="48" dy="0">Patch 0.5.5 · 掲載データに基づく独自図解</tspan></text></g></svg>