<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1072" viewBox="0 0 720 1072" role="img" aria-labelledby="title desc"><title id="title">ホロウフォーカス＋ストームウェーブ・マーシャルアーティスト</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜キャンペーン終了（ツイスター育成）：先にハントレスを作り、スピアとワーリングスラッシュ／ツイスターのジェムを確保して倉庫経由でモンクへ渡す。2 Early Mapping（ストームウェーブ移行）：ストームウェーブ／シャタリングパーム／テンペストベル（Tempest Bell）の主力3スキルへ切り替える。3 Endgame完成（リネージサポート・受け流し上限）：カオムの狂気（Kaom's Madness）を先に入手する（比較的安価で亀裂が1本増える）</desc><g font-family="sans-serif"><rect width="720" height="1072" rx="24" fill="#0d1724"/><path d="M32 36h70" stroke="#e6b45f" stroke-width="5"/><text x="118" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="118" dy="0">POE2 BUILD NAVI</tspan></text><text x="32" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="32" dy="0">ホロウフォーカス＋ストームウェーブ・</tspan><tspan x="32" dy="55.1">マーシャルアーティスト</tspan></text><text x="32" y="212" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="32" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="32" y="270" width="656" height="232" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="306" r="19" fill="#e6b45f"/><text x="59" y="313" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">1</tspan></text><text x="100" y="315" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv1〜キャンペーン終了（ツイスター育成）</tspan></text><text x="54" y="370" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">先にハントレスを作り、スピアとワーリング</tspan><tspan x="54" dy="43.5">スラッシュ／ツイスターのジェムを確保して</tspan><tspan x="54" dy="43.5">倉庫経由でモンクへ渡す</tspan></text><rect x="32" y="526" width="656" height="232" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="562" r="19" fill="#e6b45f"/><text x="59" y="569" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">2</tspan></text><text x="100" y="571" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Early Mapping（ストームウェーブ移行）</tspan></text><text x="54" y="626" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">ストームウェーブ／シャタリングパーム／テ</tspan><tspan x="54" dy="43.5">ンペストベル（Tempest Bell）の主力3ス</tspan><tspan x="54" dy="43.5">キルへ切り替える</tspan></text><rect x="32" y="782" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="818" r="19" fill="#e6b45f"/><text x="59" y="825" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">3</tspan></text><text x="100" y="827" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Endgame完成（リネージサポート・受け流し上限）</tspan></text><text x="54" y="882" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">カオムの狂気（Kaom's Madness）を先に入</tspan><tspan x="54" dy="43.5">手する（比較的安価で亀裂が1本増える）</tspan></text><text x="32" y="1033" fill="#a7b9cc" font-size="21" font-weight="400"><tspan x="32" dy="0">Patch 0.5.5 · 掲載データに基づく独自図解</tspan></text></g></svg>