<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1018" viewBox="0 0 1200 1018" role="img" aria-labelledby="title desc"><title id="title">フォーリングサンダー・マーシャルアーティスト</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜15（Act 1・クォータースタッフ）：フローズンローカスを置いてクォータースタッフストライク（Quarterstaff Strike）かウィンドブラストで壊す。2 Lv16〜Act 2終了（ホロウパーム移行）：Lv16でホロウパームテクニックへリスペックする。3 Act 3〜キャンペーン終了（ホロウパーム継続）：ホロウパームのままキャンペーンを進め切る。4 Interludes（Lv54・クォータースタッフへ帰還）：Lv54で蝋塗りのクォータースタッフをクラフトする。5 Mapping開始（ワーリングアサルト・リスペック）：ワーリングアサルト構成へリスペックする。6 Endgame完成（CI・チャージエンジン完成）：パワーチャージ6つ→フォーリングサンダーのループを維持する</desc><g font-family="sans-serif"><rect width="1200" height="1018" rx="24" fill="#0d1724"/><path d="M48 36h70" stroke="#e6b45f" stroke-width="5"/><text x="134" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="134" dy="0">POE2 BUILD NAVI</tspan></text><text x="48" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="48" dy="0">フォーリングサンダー・マーシャルアーティスト</tspan></text><text x="48" y="158" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="48" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="48" y="216" width="540" height="276" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="252" r="19" fill="#e6b45f"/><text x="75" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">1</tspan></text><text x="116" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Lv1〜15（Act 1・クォータースタッフ）</tspan></text><text x="70" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">フローズンローカスを置いてクォー</tspan><tspan x="70" dy="43.5">タースタッフストライク</tspan><tspan x="70" dy="43.5">（Quarterstaff Strike）かウィ</tspan><tspan x="70" dy="43.5">ンドブラストで壊す</tspan></text><rect x="612" y="216" width="540" height="276" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="252" r="19" fill="#e6b45f"/><text x="639" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">2</tspan></text><text x="680" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Lv16〜Act 2終了（ホロウパーム移行）</tspan></text><text x="634" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">Lv16でホロウパームテクニックへリ</tspan><tspan x="634" dy="43.5">スペックする</tspan></text><rect x="48" y="516" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="552" r="19" fill="#e6b45f"/><text x="75" y="559" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">3</tspan></text><text x="116" y="561" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Act 3〜キャンペーン終了（ホロウパーム継続）</tspan></text><text x="70" y="616" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">ホロウパームのままキャンペーンを</tspan><tspan x="70" dy="43.5">進め切る</tspan></text><rect x="612" y="516" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="552" r="19" fill="#e6b45f"/><text x="639" y="559" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">4</tspan></text><text x="680" y="561" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Interludes（Lv54・クォータースタッフへ帰還）</tspan></text><text x="634" y="616" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">Lv54で蝋塗りのクォータースタッフ</tspan><tspan x="634" dy="43.5">をクラフトする</tspan></text><rect x="48" y="728" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="764" r="19" fill="#e6b45f"/><text x="75" y="771" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">5</tspan></text><text x="116" y="773" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Mapping開始（ワーリングアサルト・リスペック）</tspan></text><text x="70" y="828" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">ワーリングアサルト構成へリスペッ</tspan><tspan x="70" dy="43.5">クする</tspan></text><rect x="612" y="728" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="764" r="19" fill="#e6b45f"/><text x="639" y="771" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">6</tspan></text><text x="680" y="773" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Endgame完成（CI・チャージエンジン完成）</tspan></text><text x="634" y="828" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">パワーチャージ6つ→フォーリング</tspan><tspan x="634" dy="43.5">サンダーのループを維持する</tspan></text><text x="48" y="979" fill="#a7b9cc" font-size="21" font-weight="400"><tspan x="48" dy="0">Patch 0.5.5 · 掲載データに基づく独自図解</tspan></text></g></svg>