<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1858" viewBox="0 0 720 1858" role="img" aria-labelledby="title desc"><title id="title">スパーク・ストームウィーバー</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜10：スパーク（Spark）をメインの攻撃ボタンに置く。2 Lv11〜20：オーブオブストーム（Orb of Storms）を作って2つ設置する。3 Lv21〜30：試練を終えて嵐の思い出（Storm’s Recollection）を取る。4 Lv31〜40：スパーク（Spark）のサポートをゼニス II（Zenith II）へ上げる。5 Lv41〜キャンペーン終了：熟考詠唱（Considered Casting）をスパーク（Spark）に付ける。6 Mapping開始：耐性とエナジーシールドを整える。7 Early Endgame：Spiritを121以上に増やす。8 Endgame完成：最大マナ5,000以上を目指す</desc><g font-family="sans-serif"><rect width="720" height="1858" rx="24" fill="#0d1724"/><path d="M32 36h70" stroke="#e6b45f" stroke-width="5"/><text x="118" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="118" dy="0">POE2 BUILD NAVI</tspan></text><text x="32" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="32" dy="0">スパーク・ストームウィーバー</tspan></text><text x="32" y="158" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="32" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="32" y="216" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="252" r="19" fill="#e6b45f"/><text x="59" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">1</tspan></text><text x="100" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv1〜10</tspan></text><text x="54" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">スパーク（Spark）をメインの攻撃ボタンに</tspan><tspan x="54" dy="43.5">置く</tspan></text><rect x="32" y="428" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="464" r="19" fill="#e6b45f"/><text x="59" y="471" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">2</tspan></text><text x="100" y="473" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv11〜20</tspan></text><text x="54" y="528" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">オーブオブストーム（Orb of Storms）を</tspan><tspan x="54" dy="43.5">作って2つ設置する</tspan></text><rect x="32" y="640" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="676" r="19" fill="#e6b45f"/><text x="59" y="683" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">3</tspan></text><text x="100" y="685" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv21〜30</tspan></text><text x="54" y="740" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">試練を終えて嵐の思い出（Storm’s</tspan><tspan x="54" dy="43.5">Recollection）を取る</tspan></text><rect x="32" y="852" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="888" r="19" fill="#e6b45f"/><text x="59" y="895" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">4</tspan></text><text x="100" y="897" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv31〜40</tspan></text><text x="54" y="952" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">スパーク（Spark）のサポートをゼニス II</tspan><tspan x="54" dy="43.5">（Zenith II）へ上げる</tspan></text><rect x="32" y="1064" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1100" r="19" fill="#e6b45f"/><text x="59" y="1107" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">5</tspan></text><text x="100" y="1109" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv41〜キャンペーン終了</tspan></text><text x="54" y="1164" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">熟考詠唱（Considered Casting）をスパ</tspan><tspan x="54" dy="43.5">ーク（Spark）に付ける</tspan></text><rect x="32" y="1276" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1312" r="19" fill="#e6b45f"/><text x="59" y="1319" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">6</tspan></text><text x="100" y="1321" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Mapping開始</tspan></text><text x="54" y="1376" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">耐性とエナジーシールドを整える</tspan></text><rect x="32" y="1444" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1480" r="19" fill="#e6b45f"/><text x="59" y="1487" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">7</tspan></text><text x="100" y="1489" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Early Endgame</tspan></text><text x="54" y="1544" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">Spiritを121以上に増やす</tspan></text><rect x="32" y="1612" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1648" r="19" fill="#e6b45f"/><text x="59" y="1655" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">8</tspan></text><text x="100" y="1657" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Endgame完成</tspan></text><text x="54" y="1712" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">最大マナ5,000以上を目指す</tspan></text><text x="32" y="1819" fill="#a7b9cc" font-size="21" font-weight="400"><tspan x="32" dy="0">Patch 0.5.5 · 掲載データに基づく独自図解</tspan></text></g></svg>