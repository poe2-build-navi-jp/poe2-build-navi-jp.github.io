<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1726" viewBox="0 0 720 1726" role="img" aria-labelledby="title desc"><title id="title">砂と炎のヴァラシュタ</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜10：Lv6でエッセンスドレイン（Essence Drain）へ移行する。2 Lv11〜20：エッセンスドレイン（Essence Drain）とコンテージョン（Contagion）を継続する。3 Lv21〜30：最初のアセンダンシーを完了する。4 Lv31〜40：Lv36で招集（Muster）を確認する。5 Lv41〜キャンペーン終了：ルザンの罠を戦闘開始時に使う。6 Mapping開始：耐性と防御を先に安定させる。7 Early Endgame：ES移行を1部位ずつ行う。8 Endgame完成：周回とボスの操作順を分ける</desc><g font-family="sans-serif"><rect width="720" height="1726" rx="24" fill="#0d1724"/><path d="M32 36h70" stroke="#e6b45f" stroke-width="5"/><text x="118" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="118" dy="0">POE2 BUILD NAVI</tspan></text><text x="32" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="32" dy="0">砂と炎のヴァラシュタ</tspan></text><text x="32" y="158" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="32" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="32" y="216" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="252" r="19" fill="#e6b45f"/><text x="59" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">1</tspan></text><text x="100" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv1〜10</tspan></text><text x="54" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">Lv6でエッセンスドレイン</tspan><tspan x="54" dy="43.5">（Essence Drain）へ移行する</tspan></text><rect x="32" y="428" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="464" r="19" fill="#e6b45f"/><text x="59" y="471" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">2</tspan></text><text x="100" y="473" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv11〜20</tspan></text><text x="54" y="528" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">エッセンスドレイン（Essence Drain）と</tspan><tspan x="54" dy="43.5">コンテージョン（Contagion）を継続する</tspan></text><rect x="32" y="640" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="676" r="19" fill="#e6b45f"/><text x="59" y="683" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">3</tspan></text><text x="100" y="685" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv21〜30</tspan></text><text x="54" y="740" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">最初のアセンダンシーを完了する</tspan></text><rect x="32" y="808" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="844" r="19" fill="#e6b45f"/><text x="59" y="851" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">4</tspan></text><text x="100" y="853" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv31〜40</tspan></text><text x="54" y="908" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">Lv36で招集（Muster）を確認する</tspan></text><rect x="32" y="976" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1012" r="19" fill="#e6b45f"/><text x="59" y="1019" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">5</tspan></text><text x="100" y="1021" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv41〜キャンペーン終了</tspan></text><text x="54" y="1076" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">ルザンの罠を戦闘開始時に使う</tspan></text><rect x="32" y="1144" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1180" r="19" fill="#e6b45f"/><text x="59" y="1187" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">6</tspan></text><text x="100" y="1189" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Mapping開始</tspan></text><text x="54" y="1244" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">耐性と防御を先に安定させる</tspan></text><rect x="32" y="1312" width="656" height="