<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1638" viewBox="0 0 720 1638" role="img" aria-labelledby="title desc"><title id="title">ツイスター・ジェムリング</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜10：ワーリングスラッシュをLv1のままにする。2 Lv11〜20：War Bannerを設定する。3 Lv21〜30：移動用と攻撃用の槍を分ける。4 Lv31〜40：武器セットの割当を確認する。5 Lv41〜キャンペーン終了：Late Campaign構成へ更新する。6 Mapping開始：Early Atlasツリーへ移る。7 Early Endgame：不足が火力か防御か切り分ける。8 Endgame完成：最大火力の操作順を安定させる</desc><g font-family="sans-serif"><rect width="720" height="1638" rx="24" fill="#0d1724"/><path d="M32 36h70" stroke="#e6b45f" stroke-width="5"/><text x="118" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="118" dy="0">POE2 BUILD NAVI</tspan></text><text x="32" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="32" dy="0">ツイスター・ジェムリング</tspan></text><text x="32" y="158" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="32" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="32" y="216" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="252" r="19" fill="#e6b45f"/><text x="59" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">1</tspan></text><text x="100" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv1〜10</tspan></text><text x="54" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">ワーリングスラッシュをLv1のままにする</tspan></text><rect x="32" y="384" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="420" r="19" fill="#e6b45f"/><text x="59" y="427" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">2</tspan></text><text x="100" y="429" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv11〜20</tspan></text><text x="54" y="484" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">War Bannerを設定する</tspan></text><rect x="32" y="552" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="58