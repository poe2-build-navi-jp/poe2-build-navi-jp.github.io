<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1814" viewBox="0 0 720 1814" role="img" aria-labelledby="title desc"><title id="title">植物オラクル</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜10：エンタングル（Entangle）を敵の進路へ置く。2 Lv11〜20：エンタングル（Entangle）のサポートを原典と照合する。3 Lv21〜30：アセンダンシー取得を進める。4 Lv31〜40：スラッシングヴァイン（Thrashing Vines）を強敵用に設定する。5 Lv41〜キャンペーン終了：キャンペーン後半ツリーを確認する。6 Mapping開始：強制された結果（Forced Outcome）取得状況を確認する。7 Early Endgame：Cheap構成を先に完成させる。8 Endgame完成：採用するEndgame段階を決める</desc><g font-family="sans-serif"><rect width="720" height="1814" rx="24" fill="#0d1724"/><path d="M32 36h70" stroke="#e6b45f" stroke-width="5"/><text x="118" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="118" dy="0">POE2 BUILD NAVI</tspan></text><text x="32" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="32" dy="0">植物オラクル</tspan></text><text x="32" y="158" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="32" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="32" y="216" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="252" r="19" fill="#e6b45f"/><text x="59" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">1</tspan></text><text x="100" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv1〜10</tspan></text><text x="54" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">エンタングル（Entangle）を敵の進路へ置</tspan><tspan x="54" dy="43.5">く</tspan></text><rect x="32" y="428" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="464" r="19" fill="#e6b45f"/><text x="59" y="471" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">2</tspan></text><text x="100" y="473" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv11〜20</tspan></text><text x="54" y="528" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">エンタングル（Entangle）のサポートを原</tspan><tspan x="54" dy="43.5">典と照合する</tspan></text><rect x="32" y="640" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="676" r="19" fill="#e6b45f"/><text x="59" y="683" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">3</tspan></text><text x="100" y="685" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv21〜30</tspan></text><text x="54" y="740" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">アセンダンシー取得を進める</tspan></text><rect x="32" y="808" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="844" r="19" fill="#e6b45f"/><text x="59" y="851" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">4</tspan></text><text x="100" y="853" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv31〜40</tspan></text><text x="54" y="908" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">スラッシングヴァイン</tspan><tspan x="54" dy="43.5">（Thrashing Vines）を強敵用に設定する</tspan></text><rect x="32" y="1020" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1056" r="19" fill="#e6b45f"/><text x="59" y="1063" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">5</tspan></text><text x="100" y="1065" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv41〜キャンペーン終了</tspan></text><text x="54" y="1120" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">キャンペーン後半ツリーを確認する</tspan></text><rect x="32" y="1188" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1224" r="19" fill="#e6b45f"/><text x="59" y="1231" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">6</tspan></text><text x="100" y="1233" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Mapping開始</tspan></text><text x="54" y="1288" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">強制された結果（Forced Outcome）取得状</tspan><tspan x=