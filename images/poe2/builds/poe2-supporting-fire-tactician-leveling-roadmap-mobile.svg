<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1408" viewBox="0 0 720 1408" role="img" aria-labelledby="title desc"><title id="title">サポーティングファイヤー・タクティシャン</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜Act 2中盤（クロスボウ育成）：武器セット設定（パーマフロストボルト＝セットI／フラグメンテーション弾＝セットII）を行う。2 Lv36〜キャンペーン終了（サポーティングファイヤー移行）：Lv36で約21,700ゴールドを使ってリスペックする。3 Mapping開始（Early）：スピリット確保のユニーク胴を最優先で買う。4 Red Maps：全ミニオンスキルレベル+2のバックラーを狙う。5 Endgame完成（CI・支配取得）：支配をアミュレットにインスタレーションする</desc><g font-family="sans-serif"><rect width="720" height="1408" rx="24" fill="#0d1724"/><path d="M32 36h70" stroke="#e6b45f" stroke-width="5"/><text x="118" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="118" dy="0">POE2 BUILD NAVI</tspan></text><text x="32" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="32" dy="0">サポーティングファイヤー・タクティシ</tspan><tspan x="32" dy="55.1">ャン</tspan></text><text x="32" y="212" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="32" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="32" y="270" width="656" height="232" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="306" r="19" fill="#e6b45f"/><text x="59" y="313" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">1</tspan></text><text x="100" y="315" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv1〜Act 2中盤（クロスボウ育成）</tspan></text><text x="54" y="370" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">武器セット設定（パーマフロストボルト＝セ</tspan><tspan x="54" dy="43.5">ットI／フラグメンテーション弾＝セットII</tspan><tspan x="54" dy="43.5">）を行う</tspan></text><rect x="32" y="526" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="562" r="19" fill="#e6b45f"/><text x="59" y="569" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">2</tspan></text><text x="100" y="571" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv36〜キャンペーン終了（サポーティングファイヤー移行）</tspan></text><text x="54" y="626" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">Lv36で約21,700ゴールドを使ってリスペッ</tspan><tspan x="54" dy="43.5">クする</tspan></text><rect x="32" y="738" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="774" r="19" fill="#e6b45f"/><text x="59" y="781" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">3</tspan></text><text x="100" y="783" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Mapping開始（Early）</tspan></text><text x="54" y="838" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">スピリット確保のユニーク胴を最優先で買う</tspan></text><rect x="32" y="906" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="942" r="19" fill="#e6b45f"/><text x="59" y="949" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">4</tspan></text><text x="100" y="951" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Red Maps</tspan></text><text x="54" y="1006" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">全ミニオンスキルレベル+2のバックラーを狙</tspan><tspan x="54" dy="43.5">う</tspan></text><rect x="32" y="1118" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1154" r="19" fill="#e6b45f"/><text x="59" y="1161" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">5</tspan></text><text x="100" y="1163" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Endgame完成（CI・支配取得）</tspan></text><text x="54" y="1218" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">支配をアミュレットにインスタレーションす</tspan><tspan x="54" dy="43.5">る</tspan></text><text x="32" y="1369" fill="#a7b9cc" font-size="21" font-weight="400"><tspan x="32" dy="0">Patch 0.5.5 · 掲載データに基づく独自図解</tspan></text></g></svg>