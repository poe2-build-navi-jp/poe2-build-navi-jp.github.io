<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1390" viewBox="0 0 720 1390" role="img" aria-labelledby="title desc"><title id="title">ミニオン・チャユラの門弟</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜37（クロスボウ・グレネード育成）：クロスボウを手に入れる。2 Lv38〜41（ミニオンへ切替：ヴァールガード・スペクター）：爆弾を投げるヴァールガードを束縛する。3 Lv42〜59（スケルトンリーバー：Act 4〜幕間）：グレータージュエラーオーブをスケルトンリーバーに使う。4 Lv60〜79（Early Mapping）：プレゼンス半径2倍の兜を入手する。5 Lv80〜89（Mid：プレイグハーヴェスター）：近接スプラッシュ付きのレアベルトを入手する。6 Lv90〜（Late〜Min-Max完成形）：アミュレットの刻印を終盤向けに替える</desc><g font-family="sans-serif"><rect width="720" height="1390" rx="24" fill="#0d1724"/><path d="M32 36h70" stroke="#e6b45f" stroke-width="5"/><text x="118" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="118" dy="0">POE2 BUILD NAVI</tspan></text><text x="32" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="32" dy="0">ミニオン・チャユラの門弟</tspan></text><text x="32" y="158" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="32" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="32" y="216" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="252" r="19" fill="#e6b45f"/><text x="59" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">1</tspan></text><text x="100" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv1〜37（クロスボウ・グレネード育成）</tspan></text><text x="54" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">クロスボウを手に入れる</tspan></text><rect x="32" y="384" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="420" r="19" fill="#e6b45f"/><text x="59" y="427" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">2</tspan></text><text x="100" y="429" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv38〜41（ミニオンへ切替：ヴァールガード・スペクター）</tspan></text><text x="54" y="484" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">爆弾を投げるヴァールガードを束縛する</tspan></text><rect x="32" y="552" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="588" r="19" fill="#e6b45f"/><text x="59" y="595" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">3</tspan></text><text x="100" y="597" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv42〜59（スケルトンリーバー：Act 4〜幕間）</tspan></text><text x="54" y="652" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">グレータージュエラーオーブをスケルトンリ</tspan><tspan x="54" dy="43.5">ーバーに使う</tspan></text><rect x="32" y="764" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="800" r="19" fill="#e6b45f"/><text x="59" y="807" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">4</tspan></text><text x="100" y="809" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv60〜79（Early Mapping）</tspan></text><text x="54" y="864" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">プレゼンス半径2倍の兜を入手する</tspan></text><rect x="32" y="932" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="968" r="19" fill="#e6b45f"/><text x="59" y="975" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">5</tspan></text><text x="100" y="977" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv80〜89（Mid：プレイグハーヴェスター）</tspan></text><text x="54" y="1032" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">近接スプラッシュ付きのレアベルトを入手す</tspan><tspan x="54" dy="43.5">る</tspan></text><rect x="32" y="1144" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1180" r="19" fill="#e6b45f"/><text x="59" y="1187" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">6</tspan></text><text x="100" y="1189" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv90〜（Late〜Min-Max完成形）</tspan></text><text x="54" y="1244" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">アミュレットの刻印を終盤向けに替える</tspan></text><text x="32" y="1351" fill="#a7b9cc" font-size="21" font-weight="400"><tspan x="32" dy="0">Patch 0.5.5 · 掲載データに基づく独自図解</tspan></text></g></svg>