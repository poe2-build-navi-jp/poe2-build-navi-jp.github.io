<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1654" viewBox="0 0 720 1654" role="img" aria-labelledby="title desc"><title id="title">ツイスター・デッドアイ</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜Act 1（ツイスター育成開始）：ハントレスのミュールを作り、ワーリングスラッシュとスピアとバックラーを倉庫経由で渡す（ミュールなしならライトニングアローでLv10前後まで育てる）。2 Act 2（フロストネクサス移行）：最初のLv2サポートジェムでフロストネクサスを切り、ファングオブフロストを外す。3 Act 3〜キャンペーン終了（ヘラルドオブアイス）：ヘラルドオブアイスを切って殲滅を底上げする。4 Mapping開始（Maps）：元素の地面を作るブーツを入手してフロストネクサスを使わずに済ませる。5 Endgame（Crit）：バラージをクールダウンごとに3回使える護符を最優先で入手し、ツイスターからサルヴォを外す。6 Endgame完成（Crit Aspirational）：完成形のユニークベルトを揃える</desc><g font-family="sans-serif"><rect width="720" height="1654" rx="24" fill="#0d1724"/><path d="M32 36h70" stroke="#e6b45f" stroke-width="5"/><text x="118" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="118" dy="0">POE2 BUILD NAVI</tspan></text><text x="32" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="32" dy="0">ツイスター・デッドアイ</tspan></text><text x="32" y="158" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="32" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="32" y="216" width="656" height="276" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="252" r="19" fill="#e6b45f"/><text x="59" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">1</tspan></text><text x="100" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv1〜Act 1（ツイスター育成開始）</tspan></text><text x="54" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">ハントレスのミュールを作り、ワーリングス</tspan><tspan x="54" dy="43.5">ラッシュとスピアとバックラーを倉庫経由で</tspan><tspan x="54" dy="43.5">渡す（ミュールなしならライトニングアロー</tspan><tspan x="54" dy="43.5">でLv10前後まで育てる）</tspan></text><rect x="32" y="516" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="552" r="19" fill="#e6b45f"/><text x="59" y="559" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">2</tspan></text><text x="100" y="561" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Act 2（フロストネクサス移行）</tspan></text><text x="54" y="616" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">最初のLv2サポートジェムでフロストネクサ</tspan><tspan x="54" dy="43.5">スを切り、ファングオブフロストを外す</tspan></text><rect x="32" y="728" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="764" r="19" fill="#e6b45f"/><text x="59" y="771" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">3</tspan></text><text x="100" y="773" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Act 3〜キャンペーン終了（ヘラルドオブアイス）</tspan></text><text x="54" y="828" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">ヘラルドオブアイスを切って殲滅を底上げす</tspan><tspan x="54" dy="43.5">る</tspan></text><rect x="32" y="940" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="976" r="19" fill="#e6b45f"/><text x="59" y="983" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">4</tspan></text><text x="100" y="985" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Mapping開始（Maps）</tspan></text><text x="54" y="1040" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">元素の地面を作るブーツを入手してフロスト</tspan><tspan x="54" dy="43.5">ネクサスを使わずに済ませる</tspan></text><rect x="32" y="1152" width="656" height="232" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1188" r="19" fill="#e6b45f"/><text x="59" y="1195" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">5</tspan></text><text x="100" y="1197" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Endgame（Crit）</tspan></text><text x="54" y="1252" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">バラージをクールダウンごとに3回使える護</tspan><tspan x="54" dy="43.5">符を最優先で入手し、ツイスターからサルヴ</tspan><tspan x="54" dy="43.5">ォを外す</tspan></text><rect x="32" y="1408" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1444" r="19" fill="#e6b45f"/><text x="59" y="1451" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">6</tspan></text><text x="100" y="1453" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Endgame完成（Crit Aspirational）</tspan></text><text x="54" y="1508" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">完成形のユニークベルトを揃える</tspan></text><text x="32" y="1615" fill="#a7b9cc" font-size="21" font-weight="400"><tspan x="32" dy="0">Patch 0.5.5 · 掲載データに基づく独自図解</tspan></text></g></svg>