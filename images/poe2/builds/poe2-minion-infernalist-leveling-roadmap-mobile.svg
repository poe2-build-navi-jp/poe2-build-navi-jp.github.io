<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1956" viewBox="0 0 720 1956" role="img" aria-labelledby="title desc"><title id="title">スナイパーミニオン・インファーナリスト</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜10：スナイパーにマルチショット I（Multishot I）を付ける。2 Lv11〜20：ミニオンレベル付き装備を探す。3 Lv21〜30：End of Act 2ツリーを確認する。4 Lv31〜40：Act 3の切替地点に到達したらヴァールガードのスペクター（Vaal Guard Spectre）を確保する（未到達ならスナイパーを継続）。5 Lv41〜キャンペーン終了：Act 3のウトザール（Utzaal）でヴァールガード（Vaal Guard）（50 Spirit）を確保するまではスナイパーを維持し、切替後にAct 4→Interludesへ進む。6 Mapping開始：Lv67切替条件を確認する。7 Early Endgame：Lvl 80→85→90の順で確認する。8 Endgame完成：採用する完成段階を1つに決める</desc><g font-family="sans-serif"><rect width="720" height="1956" rx="24" fill="#0d1724"/><path d="M32 36h70" stroke="#e6b45f" stroke-width="5"/><text x="118" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="118" dy="0">POE2 BUILD NAVI</tspan></text><text x="32" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="32" dy="0">スナイパーミニオン・インファーナリス</tspan><tspan x="32" dy="55.1">ト</tspan></text><text x="32" y="212" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="32" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="32" y="270" width="656" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="306" r="19" fill="#e6b45f"/><text x="59" y="313" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">1</tspan></text><text x="100" y="315" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv1〜10</tspan></text><text x="54" y="370" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">スナイパーにマルチショット I</tspan><tspan x="54" dy="43.5">（Multishot I）を付ける</tspan></text><rect x="32" y="482" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="518" r="19" fill="#e6b45f"/><text x="59" y="525" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">2</tspan></text><text x="100" y="527" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv11〜20</tspan></text><text x="54" y="582" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">ミニオンレベル付き装備を探す</tspan></text><rect x="32" y="650" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="686" r="19" fill="#e6b45f"/><text x="59" y="693" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">3</tspan></text><text x="100" y="695" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv21〜30</tspan></text><text x="54" y="750" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">End of Act 2ツリーを確認する</tspan></text><rect x="32" y="818" width="656" height="232" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="854" r="19" fill="#e6b45f"/><text x="59" y="861" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">4</tspan></text><text x="100" y="863" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv31〜40</tspan></text><text x="54" y="918" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">Act 3の切替地点に到達したらヴァールガー</tspan><tspan x="54" dy="43.5">ドのスペクター（Vaal Guard Spectre）</tspan><tspan x="54" dy="43.5">を確保する（未到達ならスナイパーを継続）</tspan></text><rect x="32" y="1074" width="656" height="276" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1110" r="19" fill="#e6b45f"/><text x="59" y="1117" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">5</tspan></text><text x="100" y="1119" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv41〜キャンペーン終了</tspan></text><text x="54" y="1174" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">Act 3のウトザール（Utzaal）でヴァール</tspan><tspan x="54" dy="43.5">ガード（Vaal Guard）（50 Spirit）を確</tspan><tspan x="54" dy="43.5">保するまではスナイパーを維持し、切替後に</tspan><tspan x="54" dy="43.5">Act 4→Interludesへ進む</tspan></text><rect x="32" y="1374" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1410" r="19" fill="#e6b45f"/><text x="59" y="1417" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">6</tspan></text><text x="100" y="1419" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Mapping開始</tspan></text><text x="54" y="1474" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">Lv67切替条件を確認する</tspan></text><rect x="32" y="1542" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1578" r="19" fill="#e6b45f"/><text x="59" y="1585" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">7</tspan></text><text x="100" y="1587" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Early Endgame</tspan></text><text x="54" y="1642" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">Lvl 80→85→90の順で確認する</tspan></text><rect x="32" y="1710" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="1746" r="19" fill="#e6b45f"/><text x="59" y="1753" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">8</tspan></text><text x="100" y="1755" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Endgame完成</tspan></text><text x="54" y="1810" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">採用する完成段階を1つに決める</tspan></text><text x="32" y="1917" fill="#a7b9cc" font-size="21" font-weight="400"><tspan x="32" dy="0">Patch 0.5.5 · 掲載データに基づく独自図解</tspan></text></g></svg>