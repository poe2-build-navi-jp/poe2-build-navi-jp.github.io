<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1868" viewBox="0 0 720 1868" role="img" aria-labelledby="title desc"><title id="title">スナイパーミニオン・インファーナリスト</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜10：スナイパーにMultishot Iを付ける。2 Lv11〜20：ミニオンレベル付き装備を探す。3 Lv21〜30：End of Act 2ツリーを確認する。4 Lv31〜40：Act 3の切替地点に到達したらVaal Guard Spectreを確保する（未到達ならスナイパーを継続）。5 Lv41〜キャンペーン終了：Act 3のUtzaalでVaal Guard（50 Spirit）を確保するまではスナイパーを維持し、切替後にAct 4→Interludesへ進む。6 Mapping開始：Lv67切替条件を確認する。7 Early Endgame：Lvl 80→85→90の順で確認する。8 Endgame完成：採用する完成段階を1つに決める</desc><g font-family="sans-serif"><rect width="720" height="1868" rx="24" fill="#0d1724"/><path d="M32 36h70" stroke="#e6b45f" stroke-width="5"/><text x="118" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="118" dy="0">POE2 BUILD NAVI</tspan></text><text x="32" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="32" dy="0">スナイパーミニオン・インファーナリス</tspan><tspan x="32" dy="55.1">ト</tspan></text><text x="32" y="212" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="32" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="32" y="270" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="306" r="19" fill="#e6b45f"/><text x="59" y="313" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">1</tspan></text><text x="100" y="315" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv1〜10</tspan></text><text x="54" y="370" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="54" dy="0">スナイパーにMultishot Iを付ける</tspan></text><rect x="32" y="438" width="656" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="68" cy="474" r="19" fill="#e6b45f"/><text x="59" y="481" fill="#101827" font-size="21" font-weight="700"><tspan x="59" dy="0">2</tspan></text><text x="100" y="483" fill="#91cae8" font-size="28" font-weight="700"><tspan x="100" dy="0">Lv11〜20</tspan></text><text x="54" y="538" fill="#e9eef5" font-size="30" font-weight="400"><tspan x