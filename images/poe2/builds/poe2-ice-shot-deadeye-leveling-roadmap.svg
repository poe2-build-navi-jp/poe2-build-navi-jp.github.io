<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc"><title id="title">アイスショット・デッドアイ</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜10：ライトニングロッドを先に置く。2 Lv11〜20：Lv11前後で弓を比較する。3 Lv21〜30：Lv31用アイスショットを準備する。4 Lv31〜40：Lv31でアイスショットへの切替を判断する。5 Lv41〜キャンペーン終了：lvl 42-59→60+の順で更新する。6 Mapping開始：Early非クリティカル型へ移る。7 Early Endgame：非クリティカル型を先に安定させる。8 Endgame完成：Crit移行の装備条件を確認する</desc><g font-family="sans-serif"><rect width="1200" height="1010" rx="24" fill="#0d1724"/><path d="M48 36h70" stroke="#e6b45f" stroke-width="5"/><text x="134" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="134" dy="0">POE2 BUILD NAVI</tspan></text><text x="48" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="48" dy="0">アイスショット・デッドアイ</tspan></text><text x="48" y="158" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="48" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="48" y="216" width="540" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="252" r="19" fill="#e6b45f"/><text x="75" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">1</tspan></text><text x="116" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Lv1〜10</tspan></text><text x="70" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">ライトニングロッドを先に置く</tspan></text><rect x="612" y="216" width="540" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="252" r="19" fill="#e6b45f"/><text x="639" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">2</tspan></text><text x="680" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Lv11〜20</tspan></text><text x="634" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">Lv11前後で弓を比較する</tspan></text><rect x="48" y="384" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="420" r="19" fill="#e6b45f"/><text x="75" y="427" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">3</tspan></text><text x="116" y="429" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Lv21〜30</tspan></text><text x="70" y="484" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">Lv31用アイスショットを準備する</tspan></text><rect x="612" y="384" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="420" r="19" fill="#e6b45f"/><text x="639" y="427" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">4</tspan></text><text x="680" y="429" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Lv31〜40</tspan></text><text x="634" y="484" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">Lv31でアイスショットへの切替を判</tspan><tspan x="634" dy="43.5">断する</tspan></text><rect x="48" y="596" width="540" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="632" r="19" fill="#e6b45f"/><text x="75" y="639" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">5</tspan></text><text x="116" y="641" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Lv41〜キャンペーン終了</tspan></text><text x="70" y="696" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">lvl 42-59→60+の順で更新する</tspan></text><rect x="612" y="596" width="540" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="632" r="19" fill="#e6b45f"/><text x="639" y="639" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">6</tspan></text><text x="680" y="641" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Mapping開始</tspan></text><text x="634" y="696" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">Early非クリティカル型へ移る</tspan></text><rect x="48" y="764" width="540" height="144" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="800" r="19" fill="#e6b45f