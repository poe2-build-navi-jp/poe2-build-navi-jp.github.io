<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">ホロウフォーカス＋ストームウェーブ・マーシャルアーティスト</title><desc id="desc">育成順序と各段階で最初に確認すること。1 Lv1〜キャンペーン終了（ツイスター育成）：先にハントレスを作り、スピアとワーリングスラッシュ／ツイスターのジェムを確保して倉庫経由でモンクへ渡す。2 Early Mapping（ストームウェーブ移行）：ストームウェーブ／シャタリングパーム／テンペストベル（Tempest Bell）の主力3スキルへ切り替える。3 Endgame完成（リネージサポート・受け流し上限）：カオムの狂気（Kaom's Madness）を先に入手する（比較的安価で亀裂が1本増える）</desc><g font-family="sans-serif"><rect width="1200" height="850" rx="24" fill="#0d1724"/><path d="M48 36h70" stroke="#e6b45f" stroke-width="5"/><text x="134" y="43" fill="#e6b45f" font-size="19" font-weight="700"><tspan x="134" dy="0">POE2 BUILD NAVI</tspan></text><text x="48" y="104" fill="#ffffff" font-size="38" font-weight="700"><tspan x="48" dy="0">ホロウフォーカス＋ストームウェーブ・マーシャルアーティスト</tspan></text><text x="48" y="158" fill="#bdcbd9" font-size="25" font-weight="400"><tspan x="48" dy="0">育成順序と各段階で最初に確認すること</tspan></text><rect x="48" y="216" width="540" height="276" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="252" r="19" fill="#e6b45f"/><text x="75" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">1</tspan></text><text x="116" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Lv1〜キャンペーン終了（ツイスター育成）</tspan></text><text x="70" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">先にハントレスを作り、スピアとワ</tspan><tspan x="70" dy="43.5">ーリングスラッシュ／ツイスターの</tspan><tspan x="70" dy="43.5">ジェムを確保して倉庫経由でモンク</tspan><tspan x="70" dy="43.5">へ渡す</tspan></text><rect x="612" y="216" width="540" height="276" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="252" r="19" fill="#e6b45f"/><text x="639" y="259" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">2</tspan></text><text x="680" y="261" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">Early Mapping（ストームウェーブ移行）</tspan></text><text x="634" y="316" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">ストームウェーブ／シャタリングパ</tspan><tspan x="634" dy="43.5">ーム／テンペストベル</tspan><tspan x="634" dy="43.5">（Tempest Bell）の主力3スキル</tspan><tspan x="634" dy="43.5">へ切り替える</tspan></text><rect x="48" y="516" width="540" height="232" rx="18" fill="#172536" stroke="#365067"/><circle cx="84" cy="552" r="19" fill="#e6b45f"/><text x="75" y="559" fill="#101827" font-size="21" font-weight="700"><tspan x="75" dy="0">3</tspan></text><text x="116" y="561" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">Endgame完成（リネージサポート・受け流し上限）</tspan></text><text x="70" y="616" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">カオムの狂気（Kaom's Madness）</tspan><tspan x="70" dy="43.5">を先に入手する（比較的安価で亀裂</tspan><tspan x="70" dy="43.5">が1本増える）</tspan></text><text x="48" y="811" fill="#a7b9cc" font-size="21" font-weight="400"><tspan x="48" dy="0">Patch 0.5.5 · 掲載データに基づく独自図解</tspan></text></g></svg>