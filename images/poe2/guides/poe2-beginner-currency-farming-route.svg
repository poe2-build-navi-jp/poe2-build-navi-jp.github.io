<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-labelledby="title desc"><title id="title">PoE2 金策は「回れる難度」から</title><desc id="desc">準備：死亡が少ない難度を選ぶ：使ってよい経費を決める。周回と売却：必要品を残し、余剰を売る：売れ残りは収入に混ぜない。収支から購入へ：受取額から経費を引く：次に改善する装備を1つ選ぶ</desc><rect width="720" height="960" fill="#f6f2e9"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#172d39"><rect x="28" y="25" width="664" height="110" rx="18" fill="#172d39"/><text x="50" y="91" fill="white" font-size="36" font-weight="700">金策は「回れる難度」から</text><rect x="28" y="165" width="664" height="207" rx="18" fill="white" stroke="#c7bfae"/><circle cx="88" cy="230" r="34" fill="#145f76"/><text x="88" y="242" text-anchor="middle" fill="white" font-size="36">1</text><text x="146" y="222" fill="#145f76" font-size="35" font-weight="700">準備</text><text x="146" y="276" font-size="30">死亡が少ない難度を選ぶ</text><text x="146" y="323" font-size="28">使ってよい経費を決める</text><rect x="28" y="400" width="664" height="207" rx="18" fill="white" stroke="#c7bfae"/><circle cx="88" cy="465" r="34" fill="#79501e"/><text x="88" y="477" text-anchor="middle" fill="white" font-size="36">2</text><text x="146" y="457" fill="#79501e" font-size="35" font-weight="700">周回と売却</text><text x="146" y="511" font-size="30">必要品を残し、余剰を売る</text><text x="146" y="558" font-size="28">売れ残りは収入に混ぜない</text><rect x="28" y="635" width="664" height="207" rx="18" fill="white" stroke="#c7bfae"/><circle cx="88" cy="700" r="34" fill="#486336"/><text x="88" y="712" text-anchor="middle" fill="white" font-size="36">3</text><text x="146" y="692" fill="#486336" font-size="35" font-weight="700">収支から購入へ</text><text x="146" y="746" font-size="30">受取額から経費を引く</text><text x="146" y="793" font-size="28">次に改善する装備を1つ選ぶ</text><text x="40" y="925" font-size="22" fill="#40545d">POE2ビルドナビ ／ 条件と出典は本文を確認</text></g></svg>