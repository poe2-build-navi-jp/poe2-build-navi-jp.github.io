<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 976" width="1200" height="976">
  <title id="title">PoE2 初心者向けビルドTier</title><desc id="desc">POE2ビルドナビが既存の確認済みデータから作成した独自図解です。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#242037"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".24"/></filter></defs>
  <rect width="1200" height="976" rx="34" fill="url(#bg)"/><circle cx="1090" cy="105" r="210" fill="#cc9b4b" opacity=".09"/><circle cx="90" cy="946" r="180" fill="#6e8fa8" opacity=".11"/>
  <text x="64" y="84" fill="#d4a95d" font-family="sans-serif" font-size="26" font-weight="700" letter-spacing="3">QUICK GUIDE</text><text x="64" y="158" fill="#f8fafc" font-family="sans-serif" font-size="54" font-weight="800">PoE2 初心者向けビルドTier</text><text x="64" y="210" fill="#c9d4df" font-family="sans-serif" font-size="30">強さだけでなく育てやすさと操作条件で比較</text><g filter="url(#shadow)"><rect x="64" y="252" width="1072" height="196" rx="22" fill="#182436" stroke="#31455d"/><rect x="64" y="252" width="10" height="196" rx="5" fill="#d4a95d"/><text x="98" y="306" fill="#d4a95d" font-family="sans-serif" font-size="30" font-weight="700">S TIER 1</text><text x="98" y="370" fill="#fff" font-family="sans-serif" font-size="48" font-weight="700">アイスショット・デッドアイ</text><text x="98" y="420" fill="#b9c7d6" font-family="sans-serif" font-size="34">弓で遠距離から戦い、周回と単体攻撃を使い分けたい初心者</text></g><g filter="url(#shadow)"><rect x="64" y="478" width="1072" height="196" rx="22" fill="#182436" stroke="#31455d"/><rect x="64" y="478" width="10" height="196" rx="5" fill="#d4a95d"/><text x="98" y="532" fill="#d4a95d" font-family="sans-serif" font-size="30" font-weight="700">S TIER 2</text><text x="98" y="596" fill="#fff" font-family="sans-serif" font-size="48" font-weight="700">シールドウォール・スミス</text><text x="98" y="646" fill="#b9c7d6" font-family="sans-serif" font-size="34">装備を整えやすい耐久型のリーグスターターを探している人</text></g><g filter="url(#shadow)"><rect x="64" y="704" width="1072" height="196" rx="22" fill="#182436" stroke="#31455d"/><rect x="64" y="704" width="10" height="196" rx="5" fill="#d4a95d"/><text x="98" y="758" fill="#d4a95d" font-family="sans-serif" font-size="30" font-weight="700">S TIER 3</text><text x="98" y="822" fill="#fff" font-family="sans-serif" font-size="48" font-weight="700">スナイパーミニオン・インファーナリスト</text><text x="98" y="872" fill="#b9c7d6" font-family="sans-serif" font-size="34">召喚した仲間に攻撃を任せ、敵の動きと回避へ集中したい初心者</text></g>
  <text x="64" y="942" fill="#9fb0c3" font-family="sans-serif" font-size="20">POE2ビルドナビ独自図解 ・ Patch 0.5.5</text>
</svg>