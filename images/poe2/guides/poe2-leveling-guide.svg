" y="429" fill="#91cae8" font-size="28" font-weight="700"><tspan x="116" dy="0">対応する段階</tspan></text><text x="70" y="484" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="70" dy="0">Lv31〜40の育成手順を開く</tspan></text><rect x="612" y="384" width="540" height="188" rx="18" fill="#172536" stroke="#365067"/><circle cx="648" cy="420" r="19" fill="#e6b45f"/><text x="639" y="427" fill="#101827" font-size="21" font-weight="700"><tspan x="639" dy="0">4</tspan></text><text x="680" y="429" fill="#91cae8" font-size="28" font-weight="700"><tspan x="680" dy="0">今やること3つ</tspan></text><text x="634" y="484" fill="#e9eef5" font-size="30" font-weight="400"><tspan x="634" dy="0">スキル・装備・パッシブの優先行動</tspan><tspan x="634" dy="43.5">を確認する</tspan></text><text x="48" y="635" fill="#a7b9cc" font-size="21" font-weight="400"><tspan x="48" dy="0">Patch 0.5.5 · 掲載データに基づく独自図解</tspan></text></g></svg>