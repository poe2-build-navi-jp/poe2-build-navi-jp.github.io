<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-labelledby="title desc"><title id="title">PoE2 切替は「同じ原典・段階」で</title><desc id="desc">段階を決める：作者名と段階名を1つ選ぶ：序盤と完成形を混ぜない。必要条件を揃える：装備・ジェム・パッシブ：Spiritと武器セットも確認。低難度で試す：旧装備を残して比較する：成立しなければ元へ戻す</desc><rect width="720" height="960" fill="#f6f2e9"/><g font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" fill="#172d39"><rect x="28" y="25" width="664" height="110" rx="18" fill="#172d39"/><text x="50" y="91" fill="white" font-size="36" font-weight="700">切替は「同じ原典・段階」で</text><rect x="28" y="165" width="664" height="207" rx="18" fill="white" stroke="#c7bfae"/><circle cx="88" cy="230" r="34" fill="#145f76"/><text x="88" y="242" text-anchor="middle" fill="white" font-size="36">1</text><text x="146" y="222" fill="#145f76" font-size="35" font-weight="700">段階を決める</text><text x="146" y="276" font-size="30">作者名と段階名を1つ選ぶ</text><text x="146" y="323" font-size="28">序盤と完成形を混ぜない</text><rect x="28" y="400" width="664" height="207" rx="18" fill="white" stroke="#c7bfae"/><circle cx="88" cy="465" r="34" fill="#79501e"/><text x="88" y="477" text-anchor="middle" fill="white" font-size="36">2</text><text x="146" y="457" fill="#79501e" font-size="35" font-weight="700">必要条件を揃える</text><text x="146" y="511" font-size="30">装備・ジェム・パッシブ</text><text x="146" y="558" font-size="28">Spiritと武器セットも確認</text><rect x="28" y="635" width="664" height="207" rx="18" fill="white" stroke="#c7bfae"/><circle cx="88" cy="700" r="34" fill="#486336"/><text x="88" y="712" text-anchor="middle" fill="white" font-size="36">3</text><text x="146" y="692" fill="#486336" font-size="35" font-weight="700">低難度で試す</text><text x="146" y="746" font-size="30">旧装備を残して比較する</text><text x="146" y="793" font-size="28">成立しなければ元へ戻す</text><text x="40" y="925" font-size="22" fill="#40545d">POE2ビルドナビ ／ 条件と出典は本文を確認</text></g></svg>