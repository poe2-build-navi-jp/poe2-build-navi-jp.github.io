  <text x="64" y="74" fill="#d4a95d" font-family="sans-serif" font-size="22" font-weight="700" letter-spacing="3">QUICK GUIDE</text><text x="64" y="132" fill="#f8fafc" font-family="sans-serif" font-size="43" font-weight="800">PoE2 リーグスターター</text><text x="64" y="174" fill="#c9d4df" font-family="sans-serif" font-size="24">序盤の育てやすさから候補を比較</text><g filter="url(#shadow)"><rect x="64" y="220" width="512" height="130" rx="22" fill="#182436" stroke="#31455d"/><rect x="64" y="220" width="8" height="130" rx="4" fill="#79b7dd"/><text x="92" y="257" fill="#79b7dd" font-family="sans-serif" font-size="18" font-weight="700">弓</text><text x="92" y="298" fill="#fff" font-family="sans-serif" font-size="27" font-weight="700">アイスショット・デッドアイ</text><text x="92" y="332" fill="#b9c7d6" font-family="sans-serif" font-size="19">序盤手順を確認済み</text></g><g filter="url(#shadow)"><rect x="624" y="220" width="512" height="130" rx="22" fill="#182436" stroke="#31455d"/><rect x="624" y="220" width="8" height="130" rx="4" fill="#9fb6c8"/><text x="652" y="257" fill="#9fb6c8" font-family="sans-serif" font-size="18" font-weight="700">盾・耐久</text><text x="652" y="298" fill="#fff" font-family="sans-serif" font-size="27" font-weight="700">シールドウォール・スミス</text><text x="652" y="332" fill="#b9c7d6" font-family="sans-serif" font-size="19">Lv22で主力へ</text></g><g filter="url(#shadow)"><rect x="64" y="385" width="512" height="130" rx="22" fill="#182436" stroke="#31455d"/><rect x="64" y="385" width="8" height="130" rx="4" fill="#b28adb"/><text x="92" y="422" fill="#b28adb" font-family="sans-serif" font-size="18" font-weight="700">召喚</text><text x="92" y="463" fill="#fff" font-family="sans-serif" font-size="27" font-weight="700">スナイパーミニオン・インファーナリスト</text><text x="92" y="497" fill="#b9c7d6" font-family="sans-serif" font-size="19">攻撃を仲間に任せる</text></g><g filter="url(#shadow)"><rect x="624" y="385" width="512" height="130" rx="22" fill="#182436" stroke="#31455d"/><rect x="624" y="385" width="8" height="130" rx="4" fill="#d88f70"