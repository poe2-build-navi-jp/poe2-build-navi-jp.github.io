  <text x="64" y="84" fill="#d4a95d" font-family="sans-serif" font-size="26" font-weight="700" letter-spacing="3">QUICK GUIDE</text><text x="64" y="158" fill="#f8fafc" font-family="sans-serif" font-size="54" font-weight="800">PoE2 リーグスターター</text><text x="64" y="210" fill="#c9d4df" font-family="sans-serif" font-size="30">序盤の育てやすさから候補を比較</text><g filter="url(#shadow)"><rect x="64" y="252" width="1072" height="196" rx="22" fill="#182436" stroke="#31455d"/><rect x="64" y="252" width="10" height="196" rx="5" fill="#79b7dd"/><text x="98" y="306" fill="#79b7dd" font-family="sans-serif" font-size="30" font-weight="700">弓</text><text x="98" y="370" fill="#fff" font-family="sans-serif" font-size="48" font-weight="700">アイスショット・デッドアイ</text><text x="98" y="420" fill="#b9c7d6" font-family="sans-serif" font-size="34">序盤手順を確認済み</text></g><g filter="url(#shadow)"><rect x="64" y="478" width="1072" height="196" rx="22" fill="#182436" stroke="#31455d"/><rect x="64" y="478" width="10" height="196" rx="5" fill="#9fb6c8"/><text x="98" y="532" fill="#9fb6c8" font-family="sans-serif" font-size="30" font-weight="700">盾・耐久</text><text x="98" y="596" fill="#fff" font-family="sans-serif" font-size="48" font-weight="700">シールドウォール・スミス</text><text x="98" y="646" fill="#b9c7d6" font-family="sans-serif" font-size="34">Lv22で主力へ</text></g><g filter="url(#shadow)"><rect x="64" y="704" width="1072" height="196" rx="22" fill="#182436" stroke="#31455d"/><rect x="64" y="704" width="10" height="196" rx="5" fill="#b28adb"/><text x="98" y="758" fill="#b28adb" font-family="sans-serif" font-size="30" font-weight="700">召喚</text><text x="98" y="822" fill="#fff" font-family="sans-serif" font-size="48" font-weight="700">スナイパーミニオン・インファーナリスト</text><text x="98" y="872" fill="#b9c7d6" font-family="sans-serif" font-size="34">攻撃を仲間に任せる</text></g><g filter="url(#shadow)"><rect x="64" y="930" width="1072" height="196" rx="22" fill="#182436" stroke="#31455d"/><rect x="64" y="930" width="10" height="196" rx="5" fill="#d88f70