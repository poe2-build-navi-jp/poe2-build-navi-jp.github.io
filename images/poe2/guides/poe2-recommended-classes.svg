  <title id="title">PoE2 おすすめクラス・職業</title><desc id="desc">POE2ビルドナビが既存の確認済みデータから作成した独自図解です。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#242037"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".24"/></filter></defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/><circle cx="1090" cy="105" r="210" fill="#cc9b4b" opacity=".09"/><circle cx="90" cy="600" r="180" fill="#6e8fa8" opacity=".11"/>
  <text x="64" y="74" fill="#d4a95d" font-family="sans-serif" font-size="22" font-weight="700" letter-spacing="3">QUICK GUIDE</text><text x="64" y="132" fill="#f8fafc" font-family="sans-serif" font-size="43" font-weight="800">PoE2 おすすめクラス・職業</text><text x="64" y="174" fill="#c9d4df" font-family="sans-serif" font-size="24">強さ順位ではなく続けたい戦い方から選ぶ</text><g filter="url(#shadow)"><rect x="64" y="220" width="512" height="130" rx="22" fill="#182436" stroke="#31455d"/><rect x="64" y="220" width="8" height="130" rx="4" fill="#d4a95d"/><text x="92" y="257" fill="#d4a95d" font-family="sans-serif" font-size="18" font-weight="700">遠距離</text><text x="92" y="298" fill="#fff" font-family="sans-serif" font-size="27" font-weight="700">レンジャー</text><text x="92" y="332" fill="#b9c7d6" font-family="sans-serif" font-size="19">弓で距離を保って戦う遠距離タイプ</text></g><g filter="url(#shadow)"><rect x="624" y="220" width="512" height="130" rx="22" fill="#182436" stroke="#31455d"/><rect x="624" y="220" width="8" height="130" rx="4" fill="#d4a95d"/><text x="652" y="257" fill="#d4a95d" font-family="sans-serif" font-size="18" font-weight="700">召喚</text><text x="652" y="298" fill="#fff" font-family="sans-serif" font-size="27" font-weight="700">ウィッチ</text><text x="652" y="332" fill="#b9c7d6" font-family="sans-serif" font-size="19">ミニオンや呪文を扱う召喚・魔法タイプ</text></g><g filter="url(#shadow)"><rect x="64" y="385" width="512" height="130" rx="22" fill="#182436" stroke="#31455d"/><rect x="64" y="385" width="8" height="130" rx="4" fill="#d4a95d"/><text x="92" y="422" fill="#d4a95d" font-family="sans-serif" font-size="18" font-weight="700">近接</text><text x="92" y="463" fill="#fff" font-family="sans-serif" font-size="27" font-weight="700">モンク</text><text x="92" y="497" fill="#b9c7d6" font-family="sans-serif" font-size="19">素早く間合いを変えて戦う近接タイプ</text></g><g filter="url(#shadow)"><rect x="624" y="385" width="512" height="130" rx="22" fill="#182436" stroke="#31455d"/><rect x="624" y="385" width="8" height="130" rx="4" fill="#d4a95d"/><text x="652" y="422" fill="#d4a95d" font-family="sans-serif" font-size="18" font-weight="700">耐久</text><text x="652" y="463" fill="#fff" font-family="sans-serif" font-size="27" font-weight="700">ウォリアー</text><text x="652" y="497" fill="#b9c7d6" font-family="sans-serif" font-size="19">盾や重い一撃で正面から戦う近接タイプ</text></g>
  <text x="64" y="596" fill="#9fb0c3" font-family="sans-serif" font-size="20">POE2ビルドナビ独自図解 ・ Patch 0.5.5</text>
