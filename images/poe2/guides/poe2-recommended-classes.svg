  <text x="64" y="84" fill="#d4a95d" font-family="sans-serif" font-size="26" font-weight="700" letter-spacing="3">QUICK GUIDE</text><text x="64" y="158" fill="#f8fafc" font-family="sans-serif" font-size="54" font-weight="800">PoE2 おすすめクラス・職業</text><text x="64" y="210" fill="#c9d4df" font-family="sans-serif" font-size="30">強さ順位ではなく続けたい戦い方から選ぶ</text><g filter="url(#shadow)"><rect x="64" y="252" width="1072" height="196" rx="22" fill="#182436" stroke="#31455d"/><rect x="64" y="252" width="10" height="196" rx="5" fill="#d4a95d"/><text x="98" y="306" fill="#d4a95d" font-family="sans-serif" font-size="30" font-weight="700">遠距離</text><text x="98" y="370" fill="#fff" font-family="sans-serif" font-size="48" font-weight="700">レンジャー</text><text x="98" y="420" fill="#b9c7d6" font-family="sans-serif" font-size="34">弓で距離を保って戦う遠距離タイプ</text></g><g filter="url(#shadow)"><rect x="64" y="478" width="1072" height="196" rx="22" fill="#182436" stroke="#31455d"/><rect x="64" y="478" width="10" height="196" rx="5" fill="#d4a95d"/><text x="98" y="532" fill="#d4a95d" font-family="sans-serif" font-size="30" font-weight="700">召喚</text><text x="98" y="596" fill="#fff" font-family="sans-serif" font-size="48" font-weight="700">ウィッチ</text><text x="98" y="646" fill="#b9c7d6" font-family="sans-serif" font-size="34">ミニオンや呪文を扱う召喚・魔法タイプ</text></g><g filter="url(#shadow)"><rect x="64" y="704" width="1072" height="196" rx="22" fill="#182436" stroke="#31455d"/><rect x="64" y="704" width="10" height="196" rx="5" fill="#d4a95d"/><text x="98" y="758" fill="#d4a95d" font-family="sans-serif" font-size="30" font-weight="700">近接</text><text x="98" y="822" fill="#fff" font-family="sans-serif" font-size="48" font-weight="700">モンク</text><text x="98" y="872" fill="#b9c7d6" font-family="sans-serif" font-size="34">素早く間合いを変えて戦う近接タイプ</text></g><g filter="url(#shadow)"><rect x="64" y="930" width="1072" height="196" rx="22" fill="#182436" stroke="#31455d"/><rect x="64" y="930" width="10" height="196" rx="5" fill="#d4a95d"/><text x="98" y="984" fill="#d4a95d" font-family="sans-serif" font-size="30" font-weight="700">耐久</text><text x="98" y="1048" fill="#fff" font-family="sans-serif" font-size="48" font-weight="700">ウォリアー</text><text x="98" y="1098" fill="#b9c7d6" font-family="sans-serif" font-size="34">盾や重い一撃で正面から戦う近接タイプ</text></g>
  <text x="64" y="1168" fill="#9fb0c3" font-family="sans-serif" font-size="20">POE2ビルドナビ独自図解 ・ Patch 0.5.5</text>
